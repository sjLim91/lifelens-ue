; LifeLens macOS desktop cinematic renderer tier.
; Same authoritative simulation/world truth as Windows and Android.
;
; UE 5.6 baseline is compatibility-first across supported Macs:
; - Lumen software tracing + TSR + Mesh Distance Fields are enabled.
; - Hardware RT stays off.
; - Nanite/VSM stay off in the broad Mac baseline because UE 5.6 marks them
;   Beta on Apple Silicon M2+ rather than universally supported on Mac.
; A profiled M2+ high tier may opt into Nanite/VSM later without changing Core.

[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=0
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=False

; Compatibility-first Lumen baseline.
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1
r.RayTracing=False

; Dynamic world/sky presentation.
r.SupportSkyAtmosphereAffectsHeightFog=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True

; Lumen owns indirect lighting on the desktop Mac path.
r.AllowStaticLighting=False

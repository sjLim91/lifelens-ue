; LifeLens platform rendering separation.
; Keep desktop source quality intact; Android reduces residency/distance rather
; than forcing every imported asset to be authored at mobile quality.

[Android DeviceProfile]
; One mip lower on Android for photoreal 2K+ source textures.
+CVars=r.Streaming.MipBias=1
; Pull static/skeletal mesh LOD transitions closer on mobile.
+CVars=r.StaticMeshLODDistanceScale=1.250000
+CVars=r.SkeletalMeshLODBias=1
; Keep the world populated but trim the most expensive ambient density/range.
+CVars=r.ViewDistanceScale=0.850000
+CVars=foliage.DensityScale=0.750000
+CVars=grass.DensityScale=0.700000
; Dynamic time/weather remains readable without paying desktop shadow distance.
+CVars=r.Shadow.DistanceScale=0.850000


[Windows DeviceProfile]
; Desktop keeps full source quality and pushes LOD transitions farther away.
+CVars=r.Streaming.MipBias=0
+CVars=r.StaticMeshLODDistanceScale=0.850000
+CVars=r.SkeletalMeshLODBias=0
+CVars=r.ViewDistanceScale=1.100000
+CVars=foliage.DensityScale=1.000000
+CVars=grass.DensityScale=1.000000
+CVars=r.Shadow.DistanceScale=1.100000

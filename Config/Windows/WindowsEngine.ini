; LifeLens Windows cinematic renderer tier.
; Same simulation/world truth as Android, but a higher visual ceiling.
; Software Lumen is the baseline so RTX-class hardware is not a hard requirement.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; UE5 cinematic real-time stack.
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True

; Lumen software tracing first. Hardware RT can become an optional Ultra tier
; after minimum-PC profiling rather than becoming a baseline dependency.
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1
r.RayTracing=False

; Dynamic world/sky presentation.
r.SupportSkyAtmosphereAffectsHeightFog=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True

; Lumen owns indirect lighting on the PC cinematic path.
r.AllowStaticLighting=False

name: One-shot LifeLens documentation finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-doc-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize documentation
        run: python Tools/one_shot_doc_finalize.py

      - name: Commit final documentation and remove temporary helpers
        shell: bash
        run: |
          git config user.name "LifeLens Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-doc-finalize.yml Tools/one_shot_doc_finalize.py
          git add tasks/HANDOFF_LOG.md docs/LIFELENS_SPEC_v1.1.md
          git commit -m "docs: close PR 80 handoff and canonicalize scalable world design"
          git push origin HEAD:main

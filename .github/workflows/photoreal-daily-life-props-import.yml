name: LifeLens Photoreal Daily Life Props Import

on:
  push:
    branches:
      - integration/photoreal-daily-life-props-v1
    paths:
      - '.github/workflows/photoreal-daily-life-props-import.yml'

permissions:
  contents: write

concurrency:
  group: lifelens-photoreal-daily-life-props
  cancel-in-progress: true

jobs:
  import-daily-life-props:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.6.0
      UE_ROOT_IN_CONTAINER: /home/ue4/UnrealEngine
      STAGING: ${{ github.workspace }}/assets_staging
      DIAGNOSTICS: ${{ github.workspace }}/Diagnostics/DailyLifeProps

    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Acquire CC0 daily-life prop
        shell: bash
        run: |
          set -euo pipefail
          python Tools/acquire_photoreal_environment_assets.py \
            --staging "$STAGING" \
            --resolution 1k \
            --asset wooden_bowl_01
          du -sh "$STAGING" || true

      - name: Login Epic GHCR
        shell: bash
        env:
          EPIC_GHCR_PAT: ${{ secrets.EPIC_GHCR_PAT }}
        run: |
          set -euo pipefail
          test -n "$EPIC_GHCR_PAT" || { echo 'EPIC_GHCR_PAT secret is missing'; exit 91; }
          echo "$EPIC_GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull Unreal 5.6
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo docker system prune -af || true
          docker pull "$UE_IMAGE"

      - name: Compile LifeLensEditor
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Binaries" "$GITHUB_WORKSPACE/Intermediate" "$DIAGNOSTICS"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "$UE_ROOT_IN_CONTAINER" \
            "$UE_IMAGE" \
            bash -lc './Engine/Build/BatchFiles/Linux/Build.sh LifeLensEditor Linux Development /workspace/LifeLens.uproject -WaitMutex -NoEngineChanges' \
            2>&1 | tee "$DIAGNOSTICS/editor-compile.log"

      - name: Import wooden bowl
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e LL_ASSET_STAGING=/workspace/assets_staging \
            -e LL_PHOTOREAL_MODEL_IDS=wooden_bowl_01 \
            -w "$UE_ROOT_IN_CONTAINER" \
            "$UE_IMAGE" \
            bash -lc './Engine/Binaries/Linux/UnrealEditor-Cmd /workspace/LifeLens.uproject \
              -run=pythonscript \
              -script=/workspace/Content/Environment/Photoreal/Import/import_photoreal_nature.py \
              -EnablePlugins=PythonScriptPlugin -nullrhi -unattended -nopause -nosplash -stdout -FullStdOutLogOutput' \
            2>&1 | tee "$DIAGNOSTICS/import.log"

          test -s Content/Environment/Photoreal/PolyHaven/wooden_bowl_01/SM_LL_wooden_bowl_01.uasset

      - name: Commit imported prop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LifeLens Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Content/Environment/Photoreal/PolyHaven/wooden_bowl_01
          if git diff --cached --quiet; then
            echo "No imported prop change"
            exit 0
          fi
          git commit -m "Import CC0 photoreal wooden bowl [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-Daily-Life-Props-Import
          path: Diagnostics/DailyLifeProps/
          if-no-files-found: ignore
          retention-days: 7

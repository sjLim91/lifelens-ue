name: Apply World Generation Milestone A

on:
  push:
    branches:
      - jjun/world-generation-milestone-a

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout milestone branch
        uses: actions/checkout@v4
        with:
          ref: jjun/world-generation-milestone-a
          fetch-depth: 0

      - name: Normalize patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Source/LifeLens/Simulation/LLCoreBridgeSubsystem.h')
          s = p.read_text(encoding='utf-8')
          old = '    // Native persistence bridge. Unreal SaveGame stores these bytes; it never\n'
          new = '    // Native persistence bridge.\n    // Unreal SaveGame stores these bytes; it never\n'
          if old not in s:
              raise SystemExit('Bridge persistence comment anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply Milestone A patch
        run: python Tools/apply_world_generation_milestone_a.py

      - name: Apply compile-safe and legacy-test compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Source/LifeLensCore/include/lifelens/NaturalWorldChunk.h')
          s = p.read_text(encoding='utf-8')
          anchor = '''inline bool validNaturalResourcePatch(const NaturalResourcePatch& patch, ChunkCoord ownerCoord)\n{\n    return patch.nodeId != 0\n        && validMaterialKind(patch.material)\n'''
          replacement = '''inline bool validNaturalResourceMaterial(MaterialKind material)\n{\n    switch(material){\n        case MaterialKind::Water:\n        case MaterialKind::Wood:\n        case MaterialKind::Stone:\n        case MaterialKind::Flint:\n        case MaterialKind::Fiber:\n        case MaterialKind::Clay:\n        case MaterialKind::PlantFood:\n            return true;\n        default:\n            return false;\n    }\n}\n\ninline bool validNaturalResourcePatch(const NaturalResourcePatch& patch, ChunkCoord ownerCoord)\n{\n    return patch.nodeId != 0\n        && validNaturalResourceMaterial(patch.material)\n'''
          if anchor not in s:
              raise SystemExit('natural material validator anchor not found')
          p.write_text(s.replace(anchor, replacement, 1), encoding='utf-8')

          p = Path('Source/LifeLensCore/tests/test_world_generation_milestone_a.cpp')
          s = p.read_text(encoding='utf-8')
          old = '#include "lifelens/SimulationSnapshotCodec.h"\n'
          new = '#include "lifelens/SimulationSnapshotCodec.h"\n#include "lifelens/WorldGenerationSnapshotCodec.h"\n'
          if old not in s:
              raise SystemExit('milestone test include anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('Source/LifeLensCore/tests/test_civilization_persistence.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'static ResourceNode* findResource(World& world,ResourceNodeId id)\n{\n    for(auto& node:world.resourceNodes) if(node.id==id) return &node;\n    return nullptr;\n}\n',
              'static ResourceNode* findResource(World& world,MaterialKind material)\n{\n    for(auto& node:world.resourceNodes) if(node.material==material) return &node;\n    return nullptr;\n}\n',
              1)
          s = s.replace(
              '    CHECK(source.world().resourceNodes.size()==7);\n    CHECK(source.world().storageSites.size()==1);\n',
              '    CHECK(!source.world().resourceNodes.empty());\n    CHECK(source.world().generatedNaturalChunks.size()==1);\n    CHECK(source.world().storageSites.empty());\n',
              1)
          s = s.replace(
              '    ResourceNode* flint=findResource(source.world(),2);\n',
              '    ResourceNode* flint=findResource(source.world(),MaterialKind::Flint);\n',
              1)
          s = s.replace(
              '    source.world().storageSites[0].inventory.add({ItemKind::RawMaterial,MaterialKind::Wood,7,0.52,0.91});\n',
              '    StorageSite persistedStorage;\n    persistedStorage.id=7001;\n    source.world().storageSites.push_back(persistedStorage);\n    source.world().storageSites[0].inventory.add({ItemKind::RawMaterial,MaterialKind::Wood,7,0.52,0.91});\n',
              1)
          s = s.replace(
              '    CHECK(migrated.world.resourceNodes.size()==7);\n',
              '    CHECK(migrated.world.resourceNodes.size()==snapshot.world.resourceNodes.size());\n',
              1)
          p.write_text(s, encoding='utf-8')

          p = Path('Source/LifeLensCore/tests/test_civilization_observer_read_model.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''    sim.world().storageSites[0].inventory.add(\n        {ItemKind::RawMaterial,MaterialKind::Wood,3,0.5,1.0});\n'''
          new = '''    StorageSite observedStorage;\n    observedStorage.id=7002;\n    sim.world().storageSites.push_back(observedStorage);\n    sim.world().storageSites[0].inventory.add(\n        {ItemKind::RawMaterial,MaterialKind::Wood,3,0.5,1.0});\n'''
          if old not in s:
              raise SystemExit('observer storage fixture anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '    CHECK(worldRead.resourceNodeCount==7);\n',
              '    CHECK(worldRead.resourceNodeCount==static_cast<int>(sim.world().resourceNodes.size()));\n',
              1)
          p.write_text(s, encoding='utf-8')

          p = Path('Source/LifeLensCore/tests/test_primitive_latrine_progression.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    // The outer snapshot format remains v5; only the sanitation extension\n    // advances to v2. Roundtrip must preserve the same facility identity and\n',
              '    // The outer snapshot format may advance as new authoritative extensions\n    // are added. Roundtrip must preserve the same facility identity and\n',
              1)
          s = s.replace(
              '    assert(bytes[8]==5 && bytes[9]==0 && bytes[10]==0 && bytes[11]==0);\n',
              '    assert(bytes[8]==static_cast<std::uint8_t>(SimulationSnapshotBinaryFormatVersion)\n        && bytes[9]==0 && bytes[10]==0 && bytes[11]==0);\n',
              1)
          p.write_text(s, encoding='utf-8')

          p = Path('Source/LifeLens/World/LLWorldDirector.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'EnvironmentalResidueVisualizer->RefreshFromCore(\n            *CoreBridge, CoreGridCellSizeUU, true,\n',
              'EnvironmentalResidueVisualizer->RefreshFromCore(*CoreBridge, CoreGridCellSizeUU, true,\n',
              1)
          s = s.replace(
              'EnvironmentalResidueVisualizer->RefreshFromCore(\n            *CoreBridge, CoreGridCellSizeUU, false,\n',
              'EnvironmentalResidueVisualizer->RefreshFromCore(*CoreBridge, CoreGridCellSizeUU, false,\n',
              1)
          p.write_text(s, encoding='utf-8')

          p = Path('Tools/validate_bootstrap.py')
          s = p.read_text(encoding='utf-8')
          old = "assert 'SimulationSnapshotBinaryFormatVersion=5' in snapshot_h, 'Designated sanitation site persistence requires snapshot binary format v5'"
          new = "snapshot_binary_version = int(snapshot_h.split('SimulationSnapshotBinaryFormatVersion=', 1)[1].split(';', 1)[0])\nassert snapshot_binary_version >= 5, 'Designated sanitation site persistence requires snapshot binary format v5 or newer'"
          if old not in s:
              raise SystemExit('bootstrap snapshot-version assertion anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Structural validation
        run: |
          python Tools/validate_world_genesis_wg1.py
          python Tools/validate_world_genesis_wg2.py
          python Tools/validate_world_generation_milestone_a.py
          python Tools/validate_environment_visual_feedback.py
          python Tools/validate_bootstrap.py

      - name: Build Core Release
        run: |
          cmake -S Source/LifeLensCore -B /tmp/lifelens-core-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/lifelens-core-build --config Release -j2

      - name: Run Core tests
        run: ctest --test-dir /tmp/lifelens-core-build -C Release --output-on-failure

      - name: Deterministic harness smoke
        run: |
          /tmp/lifelens-core-build/ll_harness 424242 1440 > /tmp/a.txt
          /tmp/lifelens-core-build/ll_harness 424242 1440 > /tmp/b.txt
          diff -u /tmp/a.txt /tmp/b.txt

      - name: Commit validated product changes
        run: |
          git config user.name "LifeLens Milestone Runner"
          git config user.email "actions@users.noreply.github.com"
          git add Source/LifeLensCore Source/LifeLens Tools/validate_world_generation_milestone_a.py Tools/validate_bootstrap.py
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "feat: implement World Generation Milestone A"
          git push origin HEAD:jjun/world-generation-milestone-a

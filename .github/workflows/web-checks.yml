name: LifeLens Web Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'Clients/Web/**'
      - 'Source/LifeLensCore/**'
      - 'Tools/ci_*.py'
      - 'Tools/tests/test_ci_*.py'
      - 'Tools/prepare_web_character_assets.py'
      - 'Tools/validate_web_*.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Clients/Web/**'
      - 'Source/LifeLensCore/**'
      - 'Tools/ci_*.py'
      - 'Tools/tests/test_ci_*.py'
      - 'Tools/prepare_web_character_assets.py'
      - 'Tools/validate_web_*.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifelens-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.select.outputs.web }}
      screens: ${{ steps.select.outputs.screens }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CI selection and coverage
        run: python3 -m unittest discover -s Tools/tests -p 'test_ci_*.py' -v
      - name: Select checks from the complete diff
        id: select
        run: python3 Tools/ci_scope.py

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Web dependencies once
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Prepare the pinned character assets once
        run: python3 Tools/prepare_web_character_assets.py
      - name: Typecheck once
        run: npm run typecheck
        working-directory: web
      - name: Run every shared regression entrypoint once
        run: python3 Tools/ci_web.py regressions
      - name: Build once
        run: npm run build
        working-directory: web
      - name: Install browser only for affected scenes
        if: needs.scope.outputs.screens != '[]'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright && npx playwright install --with-deps chromium
        working-directory: web
      - name: Prepare authoritative ecology fixtures only for environment captures
        if: contains(fromJSON(needs.scope.outputs.screens), 'environment')
        run: |
          cmake -S Source/LifeLensCore -B /tmp/ecology-core -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ecology-core --target ll_ecology_fixture test_natural_ecology_lifecycle -j2
          /tmp/ecology-core/test_natural_ecology_lifecycle
          mkdir -p web/tests/procedural-environment/review
          /tmp/ecology-core/ll_ecology_fixture web/tests/procedural-environment/review/core-fixture.json
      - name: Capture affected scenes only
        if: needs.scope.outputs.screens != '[]'
        env:
          SCREENS_JSON: ${{ needs.scope.outputs.screens }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('ci-scope.json').write_text(json.dumps({'screens': json.loads(os.environ['SCREENS_JSON'])}))
          PY
          python3 Tools/ci_web.py captures
      - name: Upload metrics and selected captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-review
          path: web/tests/*/review/
          if-no-files-found: ignore
          retention-days: 7

name: LifeLens Web Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'Clients/Web/**'
      - 'Source/LifeLensCore/**'
      - 'Tools/ci_*.py'
      - 'Tools/tests/test_ci_*.py'
      - 'Tools/prepare_web_character_assets.py'
      - 'Tools/validate_web_*.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Clients/Web/**'
      - 'Source/LifeLensCore/**'
      - 'Tools/ci_*.py'
      - 'Tools/tests/test_ci_*.py'
      - 'Tools/prepare_web_character_assets.py'
      - 'Tools/validate_web_*.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifelens-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CI selection and coverage
        run: python3 -m unittest discover -s Tools/tests -p 'test_ci_*.py' -v
      - name: Select checks from the complete diff
        id: select
        run: python3 Tools/ci_scope.py

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Web dependencies once
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Prepare the pinned character assets once
        run: python3 Tools/prepare_web_character_assets.py
      - name: Typecheck once
        run: npm run typecheck
        working-directory: web
      - name: Run every shared regression entrypoint once
        run: python3 Tools/ci_web.py regressions
      - name: Build once
        run: npm run build
        working-directory: web

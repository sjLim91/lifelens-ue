name: LifeLens Web Runtime Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/LifeLensCore/**'
      - 'Clients/Web/**'
      - 'Tools/build_web_client.py'
      - '.github/workflows/web-runtime-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifelens-web-runtime-release
  cancel-in-progress: true

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: web-runtime-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten

      - name: Build LifeLensCore WASM
        run: python Tools/build_web_client.py

      - name: Verify runtime
        run: |
          test -s Clients/Web/generated/lifelens_core.js
          test -s Clients/Web/generated/lifelens_core.wasm
          grep -q 'dynamicEnvironmentJson' Clients/Web/generated/lifelens_core.js
          (
            cd Clients/Web/generated
            sha256sum lifelens_core.js lifelens_core.wasm > SHA256SUMS.txt
          )

      - name: Create release if needed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG"               --target "$GITHUB_SHA"               --title "LifeLens Web Runtime"               --notes "Generated LifeLensCore browser runtime. Assets are replaced by CI from validated main."
          fi

      - name: Publish stable runtime assets
        run: |
          gh release upload "$RELEASE_TAG"             Clients/Web/generated/lifelens_core.js             Clients/Web/generated/lifelens_core.wasm             Clients/Web/generated/SHA256SUMS.txt             --clobber

      - name: Verify public release metadata
        run: |
          gh release view "$RELEASE_TAG"             --json tagName,url,assets             --jq '{tagName: .tagName, url: .url, assets: [.assets[].name]}'

name: Native Wildlife Licensed Source Review
on:
  push:
    branches: ['feat/native-wildlife-four-species-*']
    paths:
      - 'Tools/research/review_distributed_wildlife.py'
      - 'Tools/research/render_native_wildlife_sources.py'
      - 'Tools/assets/native-wildlife-selection.json'
      - '.github/workflows/native-wildlife-source-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-wildlife-sources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  licensed-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Discover individually licensed public source candidates
        run: python3 Tools/research/review_distributed_wildlife.py
      - name: Install free Blender for original surface and motion inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Render licensed originals and their native motion
        run: blender --background --factory-startup --disable-autoexec --python-exit-code 1 --threads 2 --python Tools/research/render_native_wildlife_sources.py
      - name: Preserve source review receipts on this development branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/asset-reviews/native-wildlife
          if ! git diff --cached --quiet; then
            git commit -m 'Record public four-species source review and provenance [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-wildlife-source-review
          path: docs/asset-reviews/native-wildlife/
          retention-days: 14

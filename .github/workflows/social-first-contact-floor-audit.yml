name: LifeLens Social First Contact Floor 100d Audit

on:
  pull_request:
    paths:
      - 'Source/LifeLensCore/**'
      - '.github/workflows/social-first-contact-floor-audit.yml'

permissions:
  contents: read

concurrency:
  group: lifelens-social-floor-100d-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  social-floor-audit:
    strategy:
      fail-fast: false
      matrix:
        seed: [874213954, 4242001]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 후보 계측기 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 후보 계측기 빌드
        run: cmake --build build --target ll_social_floor_audit --parallel 2

      - name: 첫 인사 진입문턱 후보 100일 계측
        run: |
          ./build/ll_social_floor_audit --seed '${{ matrix.seed }}' --days 100

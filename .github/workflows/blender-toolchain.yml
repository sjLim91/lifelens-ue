name: LifeLens Blender Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - 'chore/blender-toolchain-*'
    paths:
      - '.github/workflows/blender-toolchain.yml'
      - 'Tools/blender/**'
  pull_request:
    paths:
      - '.github/workflows/blender-toolchain.yml'
      - 'Tools/blender/**'

permissions:
  contents: read

jobs:
  blender-headless:
    name: Blender headless and GLB export
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install free Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
          blender --background --python-exit-code 1 --factory-startup --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"
      - name: Create a Blender file and a GLB export
        run: |
          mkdir -p "$RUNNER_TEMP/lifelens-blender"
          blender --background --python-exit-code 1 --factory-startup --threads 2 --python Tools/blender/verify_toolchain.py -- "$RUNNER_TEMP/lifelens-blender"
      - name: Verify Blender artifacts
        run: |
          python3 - <<'PY'
          import os, pathlib, struct
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lifelens-blender'
          glb = root / 'toolchain-smoke.glb'
          blend = root / 'toolchain-smoke.blend'
          assert blend.is_file() and blend.stat().st_size > 1024
          with glb.open('rb') as file:
              header = file.read(12)
          magic, version, length = struct.unpack('<4sII', header)
          assert magic == b'glTF' and version == 2
          assert length == glb.stat().st_size
          print('PASS Blender native project:', blend.stat().st_size, 'bytes')
          print('PASS glTF 2.0 binary:', glb.stat().st_size, 'bytes')
          PY
      - name: Author original rigged residents and tiger
        run: |
          mkdir -p "$RUNNER_TEMP/lifelens-creatures"
          blender --background --python-exit-code 1 --factory-startup --threads 2 --python Tools/blender/author_creatures.py -- "$RUNNER_TEMP/lifelens-creatures"
      - name: Verify evaluated skin and existing walk pose
        run: |
          for creature in resident-female resident-male tiger; do
            blender --background --python-exit-code 1 "$RUNNER_TEMP/lifelens-creatures/$creature.blend" --threads 2 --python Tools/blender/verify_creature_pose.py
          done

      - name: Validate GLB skinning, pigment and walk motion
        run: python3 Tools/blender/validate_creatures.py "$RUNNER_TEMP/lifelens-creatures"
      - name: Render three actual models for visual review
        run: |
          for creature in resident-female resident-male tiger; do
            blender --background --python-exit-code 1 "$RUNNER_TEMP/lifelens-creatures/$creature.blend" --threads 2 --python Tools/blender/render_creature_review.py -- "$RUNNER_TEMP/lifelens-creatures/$creature-review.png"
            blender --background --python-exit-code 1 "$RUNNER_TEMP/lifelens-creatures/$creature.blend" --threads 2 --python Tools/blender/render_creature_review.py -- "$RUNNER_TEMP/lifelens-creatures/$creature-portrait.png"
          done
          blender --background --python-exit-code 1 "$RUNNER_TEMP/lifelens-creatures/tiger.blend" --threads 2 --python Tools/blender/render_creature_review.py -- "$RUNNER_TEMP/lifelens-creatures/tiger-threequarter.png"
      - name: Verify model review renders
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lifelens-creatures'
          for kind in ('resident-female', 'resident-male', 'tiger'):
              for view in ('review','portrait'):
                  path = root / f'{kind}-{view}.png'
                  assert path.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', (kind, view)
                  assert path.stat().st_size > 10000, (kind, view)
                  print('PASS Blender review render', kind, view, path.stat().st_size)
          profile=root / 'tiger-threequarter.png'
          assert profile.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          assert profile.stat().st_size > 10000
          print('PASS tiger 3/4 head and leg visual audit',profile.stat().st_size)
          PY

      - name: Upload editable creature models and rigged GLBs
        uses: actions/upload-artifact@v4
        with:
          name: lifelens-authored-creature-prototypes
          path: ${{ runner.temp }}/lifelens-creatures/
          retention-days: 7

      - name: Upload editable project and exported GLB
        uses: actions/upload-artifact@v4
        with:
          name: lifelens-blender-toolchain-smoke
          path: ${{ runner.temp }}/lifelens-blender/
          retention-days: 7

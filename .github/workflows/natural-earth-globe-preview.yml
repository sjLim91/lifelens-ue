name: LifeLens Natural Earth Globe Preview

on:
  push:
    paths:
      - 'web/src/earth/natural-earth-land.ts'
      - 'web/src/ui/earth-globe-preview.tsx'
      - 'web/src/App.tsx'
      - 'web/src/styles.css'
      - 'web/public/earth/ne_110m_land.geojson'
      - 'web/tests/earth-globe/run.mjs'
      - '.github/workflows/natural-earth-globe-preview.yml'
  pull_request:
    paths:
      - 'web/src/earth/natural-earth-land.ts'
      - 'web/src/ui/earth-globe-preview.tsx'
      - 'web/src/App.tsx'
      - 'web/src/styles.css'
      - 'web/public/earth/ne_110m_land.geojson'
      - 'web/tests/earth-globe/run.mjs'
      - '.github/workflows/natural-earth-globe-preview.yml'

permissions:
  contents: read

jobs:
  natural-earth-globe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web dependencies
        run: cd web && npm install --no-audit --no-fund
      - name: Test geography seam projection and pinned land data
        run: cd web && node tests/earth-globe/run.mjs
      - name: Typecheck
        run: cd web && npm run typecheck
      - name: Build static globe
        run: cd web && npm run build

name: LifeLens Natural Earth Globe Preview

on:
  # Automatic checks are consolidated in web-checks.yml / core-tests.yml.
  # Keep this focused manual replay available for diagnostics.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natural-earth-globe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web dependencies
        run: cd web && npm install --no-audit --no-fund
      - name: Test geography seam projection and pinned land data
        run: cd web && node tests/earth-globe/run.mjs
      - name: Typecheck
        run: cd web && npm run typecheck
      - name: Build static globe
        run: cd web && npm run build


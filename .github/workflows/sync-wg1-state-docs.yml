name: Sync WG-1 state docs

on:
  push:
    branches: [ main ]
    paths:
      - 'Tools/sync_wg1_state_docs.py'
      - '.github/workflows/sync-wg1-state-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message != 'docs: sync WG-1 completion state' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize canonical state documents
        run: python Tools/sync_wg1_state_docs.py

      - name: Commit synchronized docs and remove temporary sync helper
        run: |
          git config user.name "LifeLens State Sync"
          git config user.email "actions@users.noreply.github.com"
          git add tasks/WORK_STATE.md
          git add tasks/TEAM_BOARD.md
          git add tasks/HANDOFF_LOG.md
          git add docs/PROJECT_PROGRESS_2026-09-15.md
          git add docs/WORLD_GENESIS_CHUNK_MIGRATION_v1.md
          git rm Tools/sync_wg1_state_docs.py
          git rm .github/workflows/sync-wg1-state-docs.yml
          git commit -m "docs: sync WG-1 completion state"
          git push origin HEAD:main

name: LifeLens Web Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/LifeLensCore/**'
      - 'Clients/Web/**'
      - 'Tools/build_web_client.py'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lifelens-web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten

      - name: Build LifeLensCore WASM
        run: python Tools/build_web_client.py

      - name: Verify static browser package
        run: |
          test -s Clients/Web/index.html
          test -s Clients/Web/app.js
          test -s Clients/Web/generated/lifelens_core.js
          test -s Clients/Web/generated/lifelens_core.wasm
          node --check Clients/Web/app.js
          node --check Clients/Web/core-adapter.js
          node --check Clients/Web/truth-map-renderer.js
          node --check Clients/Web/world-surface-renderer.js
          node --check Clients/Web/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Clients/Web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

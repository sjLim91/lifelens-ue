name: LifeLens Web WASM

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/LifeLensCore/**'
      - 'Clients/Web/**'
      - 'Tools/build_web_client.py'
      - 'Tools/verify_wasm_supplied_bytes.mjs'
      - 'Tools/verify_wasm_causal_journal.mjs'
      - 'Tools/validate_web_client_foundation.py'
      - '.github/workflows/web-wasm.yml'
  push:
    branches: [ main ]
    paths:
      - 'Source/LifeLensCore/**'
      - 'Clients/Web/**'
      - 'Tools/build_web_client.py'
      - 'Tools/verify_wasm_supplied_bytes.mjs'
      - 'Tools/verify_wasm_causal_journal.mjs'
      - 'Tools/validate_web_client_foundation.py'
      - '.github/workflows/web-wasm.yml'
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends emscripten

      - name: Export actual native cognitive Gather/Craft evidence
        run: |
          cmake -S Source/LifeLensCore -B /tmp/lifelens-causal-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/lifelens-causal-native --target test_al2_production_gather_craft -j2
          LIFELENS_CAUSAL_FIXTURE_DIR=/tmp/lifelens-causal-fixture /tmp/lifelens-causal-native/test_al2_production_gather_craft

      - name: Build LifeLensCore WASM
        run: python Tools/build_web_client.py

      - name: Verify generated runtime
        run: |
          test -s Clients/Web/generated/lifelens_core.js
          test -s Clients/Web/generated/lifelens_core.wasm
          echo "LifeLens Web WASM artifacts: PASS"

      - name: Boot generated Core from supplied WASM bytes without network
        run: node Tools/verify_wasm_supplied_bytes.mjs

      - name: Verify actual native to WASM causal chain and serialized continuation
        run: node Tools/verify_wasm_causal_journal.mjs /tmp/lifelens-causal-fixture

      - name: Upload causal verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cognitive-causal-evidence
          path: /tmp/lifelens-causal-fixture/*
          retention-days: 7

      - name: Upload browser runtime artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifelens-web-runtime
          path: |
            Clients/Web/generated/lifelens_core.js
            Clients/Web/generated/lifelens_core.wasm
          if-no-files-found: error
          retention-days: 7

      - name: Check browser JavaScript syntax
        run: |
          node --check Clients/Web/app.js
          node --check Clients/Web/core-adapter.js
          node --check Clients/Web/truth-map-renderer.js
          node --check Clients/Web/world-surface-renderer.js
          node --check Clients/Web/sw.js

      - name: Validate Web foundation
        run: python Tools/validate_web_client_foundation.py


name: LifeLens Earth to Life Navigation

on:
  push:
    paths:
      - 'web/src/earth/core-earth-scenario.ts'
      - 'web/src/ui/earth-globe-preview.tsx'
      - 'web/src/runtime/core-bridge.ts'
      - 'web/src/runtime/world-session.ts'
      - 'web/src/state/observer-store.ts'
      - 'web/src/state/observer-actions.ts'
      - 'web/src/observer-engine.ts'
      - 'web/src/App.tsx'
      - 'web/tests/earth-life-navigation/run.mjs'
      - '.github/workflows/earth-life-navigation.yml'
  pull_request:
    paths:
      - 'web/src/earth/core-earth-scenario.ts'
      - 'web/src/ui/earth-globe-preview.tsx'
      - 'web/src/runtime/core-bridge.ts'
      - 'web/src/runtime/world-session.ts'
      - 'web/src/state/observer-store.ts'
      - 'web/src/state/observer-actions.ts'
      - 'web/src/observer-engine.ts'
      - 'web/src/App.tsx'
      - 'web/tests/earth-life-navigation/run.mjs'
      - '.github/workflows/earth-life-navigation.yml'

permissions:
  contents: read

jobs:
  globe-to-real-life:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web
        run: cd web && npm install --no-audit --no-fund
      - name: Reject invented or stale Earth bindings
        run: cd web && node tests/earth-life-navigation/run.mjs
      - name: Typecheck
        run: cd web && npm run typecheck
      - name: Web production build
        run: cd web && npm run build

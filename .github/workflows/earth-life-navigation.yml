name: LifeLens Earth to Life Navigation

on:
  # Automatic checks are consolidated in web-checks.yml / core-tests.yml.
  # Keep this focused manual replay available for diagnostics.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  globe-to-real-life:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web
        run: cd web && npm install --no-audit --no-fund
      - name: Reject invented or stale Earth bindings
        run: cd web && node tests/earth-life-navigation/run.mjs
      - name: Typecheck
        run: cd web && npm run typecheck
      - name: Web production build
        run: cd web && npm run build


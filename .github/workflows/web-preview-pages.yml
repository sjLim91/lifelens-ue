name: LifeLens Web Preview

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lifelens-web-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fetch pinned LifeLensCore runtime
        run: |
          mkdir -p public/runtime
          curl --fail --location --retry 3             https://github.com/sjLim91/lifelens-ue/releases/download/web-runtime-latest/lifelens_core.js             --output public/runtime/lifelens_core.js
          curl --fail --location --retry 3             https://github.com/sjLim91/lifelens-ue/releases/download/web-runtime-latest/lifelens_core.wasm             --output public/runtime/lifelens_core.wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web/dist

  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Pages is enabled for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
            exit 0
          fi

          echo "Pages not enabled; attempting Actions-based enablement"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages"             -f build_type=workflow

  deploy:
    needs: [build, enable-pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: LifeLens Web Preview

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifelens-web-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fetch pinned LifeLensCore runtime
        run: |
          mkdir -p public/runtime
          curl --fail --location --retry 3             https://github.com/sjLim91/lifelens-ue/releases/download/web-runtime-latest/lifelens_core.js             --output public/runtime/lifelens_core.js
          curl --fail --location --retry 3             https://github.com/sjLim91/lifelens-ue/releases/download/web-runtime-latest/lifelens_core.wasm             --output public/runtime/lifelens_core.wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify preview launcher is bundled
        run: |
          test -s dist/launch.svg
          test -s dist/runtime/lifelens_core.js
          test -s dist/runtime/lifelens_core.wasm

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "preview: ${{ github.sha }}"

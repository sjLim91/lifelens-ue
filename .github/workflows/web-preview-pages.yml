name: LifeLens Web Preview

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - LifeLens Web Runtime Release
    types:
      - completed

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: web-runtime-latest

concurrency:
  group: lifelens-web-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json

      - name: Setup Python for Web nature assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Web nature staging
        uses: actions/cache@v4
        with:
          path: assets_staging/PolyHaven
          key: web-nature-1k-v1-${{ hashFiles('Tools/acquire_photoreal_environment_assets.py', 'Tools/prepare_web_photoreal_assets.py') }}

      - name: Prepare compact CC0 Web nature pack
        working-directory: .
        run: |
          python Tools/acquire_photoreal_environment_assets.py \
            --resolution 1k \
            --asset boulder_01 \
            --asset shrub_03 \
            --asset tree_stump_01
          python Tools/prepare_web_photoreal_assets.py \
            --clean \
            --asset boulder_01 \
            --asset shrub_03 \
            --asset tree_stump_01
          test -s web/public/vendor/lifelens-nature/manifest.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fetch current LifeLensCore release assets
        run: |
          rm -rf public/runtime
          mkdir -p public/runtime
          gh release download "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'lifelens_core.js' \
            --pattern 'lifelens_core.wasm' \
            --pattern 'SHA256SUMS.txt' \
            --dir public/runtime \
            --clobber

          # Older releases may not carry provenance yet. It becomes mandatory
          # only for a runtime-release-triggered preview below.
          gh release download "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'RUNTIME_COMMIT.txt' \
            --dir public/runtime \
            --clobber || true

          test -s public/runtime/lifelens_core.js
          test -s public/runtime/lifelens_core.wasm
          test -s public/runtime/SHA256SUMS.txt

          sed 's#Clients/Web/generated/##g' public/runtime/SHA256SUMS.txt \
            | (cd public/runtime && sha256sum -c -)

          if ! grep -aq 'dynamicEnvironmentJson' public/runtime/lifelens_core.js \
            && ! grep -aq 'dynamicEnvironmentJson' public/runtime/lifelens_core.wasm; then
            echo "dynamicEnvironmentJson binding missing from downloaded runtime"
            exit 1
          fi

          if [ -s public/runtime/RUNTIME_COMMIT.txt ]; then
            echo "Runtime source commit: $(tr -d '\r\n' < public/runtime/RUNTIME_COMMIT.txt)"
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test -s public/runtime/RUNTIME_COMMIT.txt
            expected="${{ github.event.workflow_run.head_sha }}"
            actual="$(tr -d '\r\n' < public/runtime/RUNTIME_COMMIT.txt)"
            echo "Expected runtime commit: $expected"
            echo "Actual runtime commit:   $actual"
            test "$actual" = "$expected"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify preview launcher is bundled
        run: |
          test -s dist/launch.html
          test -s dist/launch.svg
          grep -q "LifeLens Preview" dist/launch.html
          grep -q "lifelens-bootstrap" dist/index.html
          test -s dist/runtime/lifelens_core.js
          test -s dist/runtime/lifelens_core.wasm
          test -s dist/vendor/lifelens-nature/manifest.json

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "preview: ${{ github.sha }}"

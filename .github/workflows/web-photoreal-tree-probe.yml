name: Web Photoreal Tree Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/prepare_web_photoreal_assets.py'
      - '.github/workflows/web-photoreal-tree-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire compact CC0 tree candidates
        run: |
          python Tools/acquire_photoreal_environment_assets.py \
            --resolution 1k \
            --inspect-gltf \
            --asset tree_small_02 \
            --asset fir_sapling \
            --asset pine_sapling_small

      - name: Prepare Web tree candidate pack
        run: |
          python Tools/prepare_web_photoreal_assets.py \
            --clean \
            --asset tree_small_02 \
            --asset fir_sapling \
            --asset pine_sapling_small
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("web/public/vendor/lifelens-nature/manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          print("[LifeLens Web trees] total MiB:", round(m["payload_bytes"]/1024/1024, 2))
          for asset_id, asset in sorted(m["assets"].items()):
              print("[LifeLens Web trees]", asset_id, round(asset["payload_bytes"]/1024/1024, 2), "MiB", asset["models"])
          PY

      - name: Upload tree probe pack
        uses: actions/upload-artifact@v4
        with:
          name: lifelens-web-tree-probe
          path: web/public/vendor/lifelens-nature
          retention-days: 3
          if-no-files-found: error

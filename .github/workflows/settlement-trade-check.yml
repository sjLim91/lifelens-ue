name: Web Settlement Trade Presentation
on:
  push:
    branches: ['work/web-settlement-trade-*']
    paths: ['web/**', '.github/workflows/settlement-trade-check.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/settlement-trade-check.yml']
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: python Tools/prepare_web_character_assets.py
      - run: npm run typecheck
        working-directory: web
      - name: All Web regression entrypoints including bounded settlement/trade refresh
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          while IFS= read -r test; do
            node "$test"
          done < <(find tests -mindepth 2 -maxdepth 2 -name run.mjs | sort)
      - run: npm run build
        working-directory: web
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright && npx playwright install --with-deps chromium
        working-directory: web
      - run: node tests/settlement-trade/browser-review.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settlement-trade-review
          path: web/tests/settlement-trade/review/

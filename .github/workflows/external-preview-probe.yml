name: External Preview Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/external-preview-probe.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify one-click RawGitHack launcher
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githack.com/sjLim91/lifelens-ue/gh-pages"
          LAUNCH="$BASE/launch.svg"
          INDEX="$BASE/index.html"

          echo "== launcher GET =="
          launch_code=$(curl -L -sS -o /tmp/launch.svg -w "%{http_code}"             -H "Sec-Fetch-Dest: document" "$LAUNCH")
          launch_type=$(curl -L -sSI "$LAUNCH" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print $0}' | tail -1)
          echo "LAUNCH_STATUS=$launch_code"
          echo "LAUNCH_CONTENT_TYPE=$launch_type"
          test "$launch_code" = "200"
          grep -q "LifeLens" /tmp/launch.svg

          echo "== confirmation POST =="
          curl -sS -o /tmp/post-body -D /tmp/post-headers             -c /tmp/cookies             -X POST             -H "Referer: $LAUNCH"             "$LAUNCH" || true
          cat /tmp/post-headers
          grep -qi "set-cookie: __Http-phish=1" /tmp/post-headers

          echo "== app HTML with cookie =="
          app_code=$(curl -L -sS -o /tmp/index.html -w "%{http_code}"             -b /tmp/cookies             -H "Sec-Fetch-Dest: document"             "$INDEX")
          echo "APP_STATUS=$app_code"
          test "$app_code" = "200"
          grep -q "LifeLens Web Observer" /tmp/index.html

          asset=$(grep -oE 'src="\./assets/[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="\.\///;s/"//g')
          asset_code=$(curl -L -sS -o /tmp/app.js -w "%{http_code}" "$BASE/$asset")
          wasm_code=$(curl -L -sS -o /tmp/core.wasm -w "%{http_code}" "$BASE/runtime/lifelens_core.wasm")
          echo "ASSET_STATUS=$asset_code"
          echo "WASM_STATUS=$wasm_code"
          echo "WASM_BYTES=$(wc -c < /tmp/core.wasm)"
          test "$asset_code" = "200"
          test "$wasm_code" = "200"
          test "$(wc -c < /tmp/core.wasm)" -gt 1000

          echo "LIFELENS_PREVIEW_PASS=$LAUNCH"

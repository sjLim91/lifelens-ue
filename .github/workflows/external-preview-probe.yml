name: External Preview Probe

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RawGitHack and jsDelivr
        shell: bash
        run: |
          set -u
          RAW_BASE="https://raw.githack.com/sjLim91/lifelens-ue/gh-pages"
          JSD_BASE="https://cdn.jsdelivr.net/gh/sjLim91/lifelens-ue@gh-pages"

          probe_site () {
            local name="$1"
            local base="$2"
            echo "===== $name ====="
            local code
            code=$(curl -L -sS -o /tmp/index.html -w "%{http_code}" "$base/index.html" || true)
            echo "INDEX_STATUS=$code"
            if [ "$code" != "200" ]; then
              echo "RESULT=$name:FAIL:index"
              return
            fi

            local ctype
            ctype=$(curl -L -sSI "$base/index.html" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print $0}' | tail -1)
            echo "INDEX_CONTENT_TYPE=$ctype"

            local asset
            asset=$(grep -oE 'src="\./assets/[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="\.\///;s/"//g')
            echo "ASSET=$asset"
            local asset_code
            asset_code=$(curl -L -sS -o /tmp/app.js -w "%{http_code}" "$base/$asset" || true)
            echo "ASSET_STATUS=$asset_code"

            local wasm_code
            wasm_code=$(curl -L -sS -o /tmp/core.wasm -w "%{http_code}" "$base/runtime/lifelens_core.wasm" || true)
            echo "WASM_STATUS=$wasm_code"
            local wasm_bytes
            wasm_bytes=$(wc -c < /tmp/core.wasm 2>/dev/null || echo 0)
            echo "WASM_BYTES=$wasm_bytes"

            if [ "$asset_code" = "200" ] && [ "$wasm_code" = "200" ] && [ "$wasm_bytes" -gt 1000 ]; then
              echo "RESULT=$name:PASS:$base/index.html"
            else
              echo "RESULT=$name:FAIL:assets"
            fi
          }

          probe_site "RAWGITHACK" "$RAW_BASE"
          probe_site "JSDELIVR" "$JSD_BASE"

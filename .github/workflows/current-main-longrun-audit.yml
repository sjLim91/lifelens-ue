name: LifeLens Current-Main Long-Run Audit

on:
  push:
    branches:
      - audit/current-main-longrun-20261002
      - 'fix/p0-*'
      - 'audit/system-balance-*'
    paths:
      - 'Source/LifeLensCore/**'
      - 'Tools/audit_system_balance.py'
      - '.github/workflows/current-main-longrun-audit.yml'
      - 'docs/SIMULATION_BALANCE_CONTRACT_V2.md'
      - 'tasks/CURRENT_MAIN_LONGRUN_AUDIT.md'
      - 'PROJECT_STATUS.md'
      - 'tasks/WORK_STATE.md'
      - 'docs/DEVELOPMENT_MILESTONES.md'
  workflow_dispatch:
    inputs:
      days:
        description: '최대 시뮬레이션 일수'
        required: false
        default: '1000'
      checkpoints:
        description: '쉼표 구분 체크포인트'
        required: false
        default: '1,7,30,100,365,1000'
      seed:
        description: 'World seed'
        required: false
        default: '874213954'

permissions:
  contents: read

concurrency:
  group: lifelens-current-main-longrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  longrun-audit:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [874213954, 4242001]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Release 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 계측 불변식 검사
        run: python3 -m unittest discover -s Tools/tests -p test_system_balance_audit.py -v

      - name: 장기 계측기 빌드
        run: cmake --build build --target ll_balance_audit --parallel 2

      - name: 전 시스템 장기 계측 및 대표 seed 결정론 비교
        run: |
          python3 Tools/audit_system_balance.py run \
            --executable ./build/ll_balance_audit \
            --output longrun-results \
            --seeds '${{ matrix.seed }}' \
            --days 1000 --checkpoints '1,7,30,100,365,1000' \
            --workers 1 \
            --determinism-seed '${{ matrix.seed == 874213954 && '874213954' || '' }}'

      - name: 사건·계측·재개 기록 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longrun-audit-${{ matrix.seed }}
          path: longrun-results/
          if-no-files-found: error
          retention-days: 30

  manual-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Release 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 계측 불변식 검사
        run: python3 -m unittest discover -s Tools/tests -p test_system_balance_audit.py -v

      - name: 장기 계측기 빌드
        run: cmake --build build --target ll_balance_audit --parallel 2

      - name: 수동 전 시스템 계측
        run: |
          python3 Tools/audit_system_balance.py run \
            --executable ./build/ll_balance_audit \
            --output longrun-results \
            --seeds '${{ inputs.seed }}' \
            --days '${{ inputs.days }}' \
            --checkpoints '${{ inputs.checkpoints }}' \
            --workers 1 --determinism-seed '${{ inputs.seed }}'

      - name: 사건·계측·재개 기록 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longrun-audit-manual
          path: longrun-results/
          if-no-files-found: error
          retention-days: 30

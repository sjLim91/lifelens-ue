name: LifeLens Current-Main Long-Run Audit

on:
  push:
    branches:
      - audit/current-main-longrun-20261002
    paths:
      - 'Source/LifeLensCore/**'
      - '.github/workflows/current-main-longrun-audit.yml'
      - 'docs/SIMULATION_BALANCE_CONTRACT_V2.md'
      - 'tasks/CURRENT_MAIN_LONGRUN_AUDIT.md'
      - 'PROJECT_STATUS.md'
      - 'tasks/WORK_STATE.md'
      - 'docs/DEVELOPMENT_MILESTONES.md'
  workflow_dispatch:
    inputs:
      days:
        description: '최대 시뮬레이션 일수'
        required: false
        default: '1000'
      checkpoints:
        description: '쉼표 구분 체크포인트'
        required: false
        default: '100,365,1000'
      seed:
        description: 'World seed'
        required: false
        default: '874213954'

permissions:
  contents: read

concurrency:
  group: lifelens-current-main-longrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  longrun-audit:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [874213954, 4242001]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Release 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 장기 계측기 빌드
        run: cmake --build build --target ll_balance_audit --parallel 2

      - name: 100·365·1000일 통합 계측
        run: |
          set -o pipefail
          /usr/bin/time -v ./build/ll_balance_audit             --seed '${{ matrix.seed }}'             --days 1000             --checkpoints '100,365,1000'             2>&1 | tee "longrun-${{ matrix.seed }}.log"

      - name: 계측 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longrun-audit-${{ matrix.seed }}
          path: longrun-${{ matrix.seed }}.log
          if-no-files-found: ignore
          retention-days: 14

  manual-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Release 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 장기 계측기 빌드
        run: cmake --build build --target ll_balance_audit --parallel 2

      - name: 수동 장기 계측
        run: |
          set -o pipefail
          /usr/bin/time -v ./build/ll_balance_audit             --seed '${{ inputs.seed }}'             --days '${{ inputs.days }}'             --checkpoints '${{ inputs.checkpoints }}'             2>&1 | tee longrun-manual.log

      - name: 계측 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longrun-audit-manual
          path: longrun-manual.log
          if-no-files-found: ignore
          retention-days: 14

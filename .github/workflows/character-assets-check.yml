name: LifeLens Character Asset Verification

on:
  push:
    branches: ['visual/resident-motion-tools-phenotype-20261002']
    paths:
      - 'Tools/prepare_web_character_assets.py'
      - '.github/workflows/character-assets-check.yml'
      - 'web/src/render/resident-*.ts'
      - 'web/tests/characters/**'
      - 'web/tests/action-context/**'
      - 'web/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 무료 CC0 자산 다운로드 및 고정 해시 검증
        run: python Tools/prepare_web_character_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-character-assets
          path: web/public/vendor/characters/
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 웹 의존성 설치
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: 타입·행동·외형 회귀 및 빌드 검증
        run: |
          cd web
          npm run typecheck
          node tests/characters/run.mjs
          node tests/action-context/run.mjs
          npm run build
      - name: 실제 GLB 리그·모션 16개 포즈 검증
        run: node web/tests/characters/export-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: character-pose-review
          path: web/tests/characters/review/poses.json
          retention-days: 7

name: LifeLens Character Asset Verification

on:
  push:
    branches: ['visual/resident-motion-tools-phenotype-20261002']
    paths:
      - 'Tools/prepare_web_character_assets.py'
      - '.github/workflows/character-assets-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 무료 CC0 자산 다운로드 및 고정 해시 검증
        run: python Tools/prepare_web_character_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-character-assets
          path: web/public/vendor/characters/
          retention-days: 7

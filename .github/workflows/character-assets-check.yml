name: LifeLens Character Asset Verification

on:
  # Automatic checks are consolidated in web-checks.yml / core-tests.yml.
  # Keep this focused manual replay available for diagnostics.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 무료 CC0 자산 다운로드 및 고정 해시 검증
        run: python Tools/prepare_web_character_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-character-assets
          path: web/public/vendor/characters/
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 웹 의존성 설치
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: 타입·행동·외형 회귀 및 빌드 검증
        run: |
          cd web
          npm run typecheck
          node tests/characters/run.mjs
          node tests/action-context/run.mjs
          node ../Tools/extract_web_sleep_pose.mjs --check
          node tests/resident-motion/run.mjs
          node tests/procedural-motion/run.mjs
          npm run build
      - name: 무료 Chromium 브라우저 검증 준비
        working-directory: web
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: 절차적 모션 데스크톱·모바일 WebGL 화면 검증
        run: node web/tests/procedural-motion/browser-review.mjs
      - name: 실제 GLB 리그·모션 16개 포즈 검증
        run: node web/tests/characters/export-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: character-pose-review
          path: |
            web/tests/characters/review/poses.json
            web/tests/resident-motion/review/poses.json
            web/tests/procedural-motion/review/poses.json
            web/tests/procedural-motion/review/*.png
            web/tests/procedural-motion/review/browser-results.json
          retention-days: 7



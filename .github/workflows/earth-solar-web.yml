name: LifeLens Earth Solar Web Observation

on:
  # Automatic checks are consolidated in web-checks.yml / core-tests.yml.
  # Keep this focused manual replay available for diagnostics.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earth-solar-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web
        run: cd web && npm install --no-audit --no-fund
      - name: Contract validation
        run: cd web && node tests/earth-solar-observation/run.mjs
      - name: Web Typecheck
        run: cd web && npm run typecheck
      - name: Production Build
        run: cd web && npm run build


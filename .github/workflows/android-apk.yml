name: LifeLens UE 5.6 Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode. container reuses the prebuilt UE 5.6 Linux host instead of compiling UnrealEditor from source.'
        required: true
        default: container
        type: choice
        options:
          - container
  push:
    branches: [ main ]
    paths:
      - 'tasks/ANDROID_BUILD_REQUEST.md'

permissions:
  contents: write
  packages: read

concurrency:
  group: lifelens-android-apk
  cancel-in-progress: true

env:
  UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.6.0
  UE_ROOT_IN_CONTAINER: /home/ue4/UnrealEngine
  ANDROID_API: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '25.1.8937393'
  PROJECT_ROOT: ${{ github.workspace }}
  BUILD_OUTPUT: ${{ github.workspace }}/AndroidOutput
  DIAGNOSTICS: ${{ github.workspace }}/Diagnostics

jobs:
  build-android:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout latest LifeLens source
        uses: actions/checkout@v4

      - name: Record source and reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.repository.private }}' = 'false'
          test '${{ runner.os }}' = 'Linux'
          mkdir -p "$DIAGNOSTICS" "$BUILD_OUTPUT"
          echo "LIFELENS_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_PHASE=android-container-v2"
          echo "LIFELENS_SOURCE_SHA=$(git rev-parse HEAD)"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo docker container prune -f || true
          sudo docker builder prune -af || true
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          df -h /

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure UE 5.6 Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          PACKAGES=()
          test -d "$ANDROID_HOME/platform-tools" || PACKAGES+=('platform-tools')
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}" || PACKAGES+=("platforms;android-${ANDROID_API}")
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" || PACKAGES+=("build-tools;${ANDROID_BUILD_TOOLS}")
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" || PACKAGES+=("ndk;${ANDROID_NDK_VERSION}")
          if [ ${#PACKAGES[@]} -gt 0 ]; then
            "$SDKMANAGER" "${PACKAGES[@]}"
          fi
          test -x "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "NDKROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
            echo "NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_READY sdk=${ANDROID_API} buildTools=${ANDROID_BUILD_TOOLS} ndk=${ANDROID_NDK_VERSION}"

      - name: Validate Android source and cook boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_platform_cook_boundaries.py
          python3 Tools/validate_zero_cost_asset_provenance.py
          python3 Tools/validate_android_build_pipeline.py

      - name: Login and pull prebuilt Unreal 5.6 host
        shell: bash
        env:
          EPIC_GHCR_PAT: ${{ secrets.EPIC_GHCR_PAT }}
        run: |
          set -euo pipefail
          test -n "$EPIC_GHCR_PAT" || { echo 'EPIC_GHCR_PAT secret is missing'; exit 91; }
          echo "$EPIC_GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker image inspect "$UE_IMAGE" >/dev/null 2>&1; then
            echo 'UE_IMAGE_CACHE_HIT'
          else
            echo 'UE_IMAGE_CACHE_MISS'
            docker pull "$UE_IMAGE"
          fi
          docker image inspect "$UE_IMAGE" --format '{{.Id}} {{.Size}}'
          df -h /

      - name: Verify prebuilt host has Android build support
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$UE_IMAGE" bash -lc "
            test -x '$UE_ROOT_IN_CONTAINER/Engine/Build/BatchFiles/Linux/Build.sh' &&
            test -x '$UE_ROOT_IN_CONTAINER/Engine/Build/BatchFiles/RunUAT.sh' &&
            test -f '$UE_ROOT_IN_CONTAINER/Engine/Source/Programs/UnrealBuildTool/Platform/Android/UEBuildAndroid.cs' &&
            test -f '$UE_ROOT_IN_CONTAINER/Engine/Binaries/DotNET/UnrealBuildTool/UnrealBuildTool.dll'
          "
          echo 'UE56_PREBUILT_ANDROID_HOST_READY'

      - name: Compile LifeLens Android Development and Cook and package LifeLens APK
        timeout-minutes: 190
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_OUTPUT"
          mkdir -p "$BUILD_OUTPUT" "$DIAGNOSTICS"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"

          docker run --name lifelens-android-build             -v "$GITHUB_WORKSPACE:/workspace"             -v "$ANDROID_HOME:/opt/android-sdk:ro"             -v "$JAVA_HOME:/opt/jdk:ro"             -e ANDROID_HOME=/opt/android-sdk             -e ANDROID_SDK_ROOT=/opt/android-sdk             -e NDKROOT=/opt/android-sdk/ndk/${ANDROID_NDK_VERSION}             -e NDK_ROOT=/opt/android-sdk/ndk/${ANDROID_NDK_VERSION}             -e JAVA_HOME=/opt/jdk             -e HOME=/tmp/lifelens-home             -w "$UE_ROOT_IN_CONTAINER"             "$UE_IMAGE"             bash -lc '
              set -euo pipefail
              export PATH="/opt/jdk/bin:/opt/android-sdk/platform-tools:/opt/android-sdk/build-tools/34.0.0:$PATH"
              mkdir -p "$HOME" /workspace/Diagnostics /workspace/AndroidOutput

              echo "BUILD_PHASE=android-compile"
              ./Engine/Build/BatchFiles/Linux/Build.sh                 LifeLens Android Development /workspace/LifeLens.uproject -WaitMutex                 2>&1 | tee /workspace/Diagnostics/android-compile.log
              echo "LIFELENS_ANDROID_COMPILE_PASS"

              echo "BUILD_PHASE=android-package"
              ./Engine/Build/BatchFiles/RunUAT.sh                 BuildCookRun                 -project=/workspace/LifeLens.uproject                 -targetplatform=Android                 -cookflavor=ASTC                 -clientconfig=Development                 -build -cook -stage -pak -package -archive                 -archivedirectory=/workspace/AndroidOutput                 -noP4 -unattended -utf8output                 2>&1 | tee /workspace/Diagnostics/android-package.log
              echo "LIFELENS_ANDROID_PACKAGE_PASS"
            '

          docker rm -f lifelens-android-build >/dev/null 2>&1 || true
          find "$BUILD_OUTPUT" -type f -printf '%p %s bytes\n' | sort

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$BUILD_OUTPUT" -type f -name '*.apk' | head -1)
          test -n "$APK" || { echo 'LIFELENS_APK_NOT_FOUND'; exit 44; }
          cp "$APK" "$GITHUB_WORKSPACE/LifeLens-Android-Development-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/LifeLens-Android-Development-arm64.apk" > "$GITHUB_WORKSPACE/LifeLens-Android-Development-arm64.sha256"
          ls -lh "$GITHUB_WORKSPACE/LifeLens-Android-Development-arm64.apk"
          echo "LIFELENS_APK_FILE_PRESENT"

      - name: Validate packaged APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/LifeLens-Android-Development-arm64.apk"
          AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -s "$APK"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          APK_BYTES=$(stat -c '%s' "$APK")
          echo "APK_BYTES=$APK_BYTES"
          test "$APK_BYTES" -gt 5000000 || { echo 'LIFELENS_APK_UNEXPECTEDLY_SMALL'; exit 45; }

          "$AAPT" dump badging "$APK" | tee "$DIAGNOSTICS/apk-badging.txt"
          grep -F "package: name='com.lifelens.sim'" "$DIAGNOSTICS/apk-badging.txt"
          grep -F "sdkVersion:'30'" "$DIAGNOSTICS/apk-badging.txt"
          grep -F "targetSdkVersion:'34'" "$DIAGNOSTICS/apk-badging.txt"
          grep -F "launchable-activity:" "$DIAGNOSTICS/apk-badging.txt"

          unzip -l "$APK" | tee "$DIAGNOSTICS/apk-contents.txt"
          grep -Eq 'lib/arm64-v8a/[^ ]+\.so' "$DIAGNOSTICS/apk-contents.txt" || {
            echo 'LIFELENS_APK_ARM64_NATIVE_LIBRARY_MISSING'
            exit 46
          }
          if grep -Eq 'lib/x86_64/[^ ]+\.so' "$DIAGNOSTICS/apk-contents.txt"; then
            echo 'LIFELENS_APK_UNEXPECTED_X86_64_LIBRARY'
            exit 47
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$DIAGNOSTICS/apk-signature.txt"
          echo 'LIFELENS_APK_INTEGRITY_PASS'
          echo 'LIFELENS_APK_PIPELINE_PASS'

      - name: Upload LifeLens APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-Android-APK-container
          path: |
            LifeLens-Android-Development-arm64.apk
            LifeLens-Android-Development-arm64.sha256
            Diagnostics/apk-badging.txt
            Diagnostics/apk-contents.txt
            Diagnostics/apk-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-Android-Diagnostics-container
          path: Diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish LifeLens APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="lifelens-android-container-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             LifeLens-Android-Development-arm64.apk             LifeLens-Android-Development-arm64.sha256             --title "LifeLens Android container build #${GITHUB_RUN_NUMBER}"             --notes "UE 5.6 Android Development APK. Source: ${LIFELENS_SOURCE_SHA}. Host image: ${UE_IMAGE}. SDK 34 / NDK r25b / Java 21."

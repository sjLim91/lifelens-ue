name: Apply HumanWaste visual feedback patch v2

on:
  push:
    branches: [ jjun/human-waste-visual-feedback-v1 ]
    paths:
      - '.github/workflows/apply-human-waste-visual-feedback-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: jjun/human-waste-visual-feedback-v1
          fetch-depth: 0

      - name: Apply and validate patch
        run: |
          python Tools/apply_human_waste_visual_feedback_patch.py
          python Tools/validate_environment_visual_feedback.py
          git checkout HEAD -- .github/workflows/preflight.yml

      - name: Commit product implementation only
        run: |
          git config user.name "LifeLens Visual Feedback Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Source/LifeLens/World/LLWorldDirector.h
          git add Source/LifeLens/World/LLWorldDirector.cpp
          git add Source/LifeLens/World/LLEnvironmentalResidueVisualizerComponent.h
          git add Source/LifeLens/World/LLEnvironmentalResidueVisualizerComponent.cpp
          git add Tools/validate_environment_visual_feedback.py
          git add docs/WORLD_ENVIRONMENTAL_VISUAL_FEEDBACK_v1.md
          git commit -m "feat: add HumanWaste environmental visual feedback v1"
          git push origin HEAD:jjun/human-waste-visual-feedback-v1

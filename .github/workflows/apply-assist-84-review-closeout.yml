name: Apply #84 Review Closeout

on:
  push:
    branches:
      - jjun/assist-84-review-closeout

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout assist branch
        uses: actions/checkout@v4
        with:
          ref: jjun/assist-84-review-closeout
          fetch-depth: 0

      - name: Reconcile canonical Motion lane
        run: python Tools/apply_assist_84_review_closeout.py

      - name: Verify single Motion truth
        run: |
          python - <<'PY'
          from pathlib import Path
          w = Path('tasks/WORK_STATE.md').read_text(encoding='utf-8')
          b = Path('tasks/TEAM_BOARD.md').read_text(encoding='utf-8')
          assert w.count('### Dagyeom lane — Character Motion Bootstrap') == 1
          assert '19. **Motion Bootstrap — READY_NOW**' not in w
          assert 'Character Motion Bootstrap — READY_NOW' not in b
          assert 'ACTIVE #84' in w
          assert 'ACTIVE #84' in b
          print('#84 state reconciliation verification: PASS')
          PY

      - name: Commit docs only and remove helper
        run: |
          git config user.name "LifeLens Assist Runner"
          git config user.email "actions@users.noreply.github.com"
          git rm Tools/apply_assist_84_review_closeout.py .github/workflows/apply-assist-84-review-closeout.yml
          git add tasks/WORK_STATE.md tasks/TEAM_BOARD.md
          git commit -m "docs: reconcile #84 motion lane state"
          git push origin HEAD:jjun/assist-84-review-closeout

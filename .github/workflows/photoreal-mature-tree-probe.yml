name: LifeLens Mature Tree Payload Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/photoreal-mature-tree-probe.yml'
      - 'Tools/acquire_photoreal_environment_assets.py'

permissions:
  contents: read

concurrency:
  group: lifelens-mature-tree-payload-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe-mature-tree-payload:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Probe Poly Haven 1K glTF candidates
        shell: bash
        run: |
          set -uo pipefail
          passed=0
          for asset in \
            pachira_aquatica_01 \
            quiver_tree_01 \
            quiver_tree_02 \
            tree_small_02 \
            island_tree_02
          do
            echo "::group::LifeLens candidate $asset"
            if python Tools/acquire_photoreal_environment_assets.py \
              --staging "${{ runner.temp }}/lifelens-asset-probe" \
              --resolution 1k \
              --asset "$asset" \
              --dry-run \
              --inspect-gltf
            then
              echo "[LifeLens assets] CANDIDATE_PASS=$asset"
              passed=$((passed + 1))
            else
              echo "[LifeLens assets] CANDIDATE_REJECT=$asset"
            fi
            echo "::endgroup::"
          done
          if [ "$passed" -lt 1 ]; then
            echo "No candidate satisfied the 90 MiB budget."
            exit 93
          fi
          echo "[LifeLens assets] viable candidate count=$passed"

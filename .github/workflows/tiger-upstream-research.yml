name: Tiger Public Upstream Metadata Research
on:
  push:
    branches: ['feat/tiger-source-web-integration-*']
    paths:
      - 'Tools/research/inspect_public_tiger.py'
      - '.github/workflows/tiger-upstream-research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned public GLB metadata without asset admission
        run: python3 Tools/research/inspect_public_tiger.py
      - name: Preserve metadata research receipt only
        run: |
          mkdir -p docs/asset-reviews/google-tiger
          cp review/upstream-tiger-metadata.json docs/asset-reviews/google-tiger/metadata.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/asset-reviews/google-tiger/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record upstream tiger metadata research; no model admission [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-tiger-metadata-only
          path: review/upstream-tiger-metadata.json
          retention-days: 7

name: Close PR82 state sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/close-pr82-state-sync.yml'
      - 'Tools/close_pr82_state_sync.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical state sync
        run: |
          git pull --ff-only origin main
          python Tools/close_pr82_state_sync.py

      - name: Commit state sync and remove one-shot files
        run: |
          rm Tools/close_pr82_state_sync.py
          rm .github/workflows/close-pr82-state-sync.yml
          git config user.name "LifeLens State Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: close HumanWaste visual feedback and promote World Genesis WG-1"
          git push origin HEAD:main

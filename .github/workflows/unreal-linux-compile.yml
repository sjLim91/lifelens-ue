name: LifeLens Unreal Linux Compile

on:
  pull_request:
    branches: [ main ]
    paths:
      # Any Unreal module or pure Core C++ change can break the integrated UE
      # translation unit/UHT/UBT/link. Keep this gate broad enough that Character,
      # UI, AI, Save, World, Simulation and LifeLensCore changes cannot bypass it.
      - 'Source/LifeLens/**'
      - 'Source/LifeLensCore/**'
      - 'Source/LifeLens.Target.cs'
      - 'Source/LifeLensEditor.Target.cs'
      - 'LifeLens.uproject'
      - '.github/workflows/unreal-linux-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifelens-unreal-linux-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-linux:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.6.0
      UE_ROOT_IN_CONTAINER: /home/ue4/UnrealEngine
      DIAGNOSTICS: ${{ github.workspace }}/Diagnostics
      UE_PROJECT_CACHE_VERSION: ue56-linux-dev-v1

    steps:
      - name: Checkout LifeLens source
        uses: actions/checkout@v4

      - name: Restore reusable Unreal project compile cache
        id: ue-project-cache
        uses: actions/cache@v4
        with:
          path: |
            Intermediate/Build/Linux
            Binaries/Linux/*.target
            Binaries/Linux/*.modules
          key: ${{ env.UE_PROJECT_CACHE_VERSION }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.UE_PROJECT_CACHE_VERSION }}-${{ runner.os }}-

      - name: Preflight zero-cost runner and Epic GHCR credential
        shell: bash
        env:
          EPIC_GHCR_PAT: ${{ secrets.EPIC_GHCR_PAT }}
        run: |
          set -euo pipefail
          test '${{ github.event.repository.private }}' = 'false'
          test '${{ runner.os }}' = 'Linux'
          test -n "$EPIC_GHCR_PAT" || { echo 'EPIC_GHCR_PAT secret is missing'; exit 91; }
          test -f "$GITHUB_WORKSPACE/LifeLens.uproject"
          mkdir -p "$DIAGNOSTICS"
          echo "$EPIC_GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "PROJECT_COMPILE_CACHE_HIT=${{ steps.ue-project-cache.outputs.cache-hit }}"
          echo 'ZERO COST: public GitHub-hosted Linux runner; Linux compile only, no Android/cook/package.'

      - name: Reclaim disk without evicting a reusable Unreal image
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          # Do not use "docker system prune -a": it deletes a locally reusable
          # Unreal image. Hosted runners are usually cold, but preserving a hit
          # also makes this workflow ready for persistent/self-hosted runners.
          sudo docker container prune -f || true
          sudo docker builder prune -af || true
          df -h /

      - name: Reuse or pull prebuilt Unreal 5.6 Linux development image
        shell: bash
        run: |
          set -euo pipefail
          if docker image inspect "$UE_IMAGE" >/dev/null 2>&1; then
            echo 'UE_IMAGE_CACHE_HIT: reusing local Unreal image'
          else
            echo 'UE_IMAGE_CACHE_MISS: pulling Unreal image from GHCR'
            docker pull "$UE_IMAGE" 2>&1 | tee "$DIAGNOSTICS/docker-pull.log"
          fi
          docker image inspect "$UE_IMAGE" --format '{{.Id}} {{.Size}}'
          df -h /

      - name: Verify image is Linux compile capable
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$UE_IMAGE" bash -lc \
            "test -x '$UE_ROOT_IN_CONTAINER/Engine/Build/BatchFiles/Linux/Build.sh' && test -f '$UE_ROOT_IN_CONTAINER/Engine/Binaries/DotNET/UnrealBuildTool/UnrealBuildTool.dll'"
          echo 'UE56_LINUX_COMPILE_IMAGE_READY'

      - name: Compile LifeLens Linux Development with UHT and UBT
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Binaries" "$GITHUB_WORKSPACE/Intermediate"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "$UE_ROOT_IN_CONTAINER" \
            "$UE_IMAGE" \
            bash -lc './Engine/Build/BatchFiles/Linux/Build.sh LifeLens Linux Development /workspace/LifeLens.uproject -WaitMutex -NoEngineChanges' \
            2>&1 | tee "$DIAGNOSTICS/unreal-linux-compile.log"
          echo 'LIFELENS_UE56_LINUX_COMPILE_PASS'
          find "$GITHUB_WORKSPACE/Binaries" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | head -100 || true

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-Unreal-Linux-Compile-Diagnostics
          path: Diagnostics/
          if-no-files-found: ignore
          retention-days: 7

name: Gate A Core Runtime Verification

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gate-a-core-runtime.yml'

permissions:
  contents: read

jobs:
  gate-a-core-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Configure Core
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Core + Gate A contract tests
        run: |
          cmake --build build --target \
            lifelens_core \
            test_production_new_game \
            test_world_generation_milestone_a \
            test_external_physical_execution \
            test_environmental_residue \
            test_environmental_exposure \
            test_core_save_load \
            test_civilization_observer_read_model \
            -j2

      - name: Build integrated Gate A runtime harness
        shell: bash
        run: |
          cat > /tmp/gate_a_runtime.cpp <<'CPP'
          #include <cassert>
          #include <cstdint>
          #include <iostream>
          #include <string>
          #include <vector>
          #include "lifelens/NaturalWorldChunk.h"
          #include "lifelens/Simulation.h"
          #include "lifelens/SimulationSnapshotCodec.h"

          using namespace lifelens;

          int main()
          {
              constexpr WorldSeed worldSeed=874213954ULL;
              constexpr PopulationSeed populationSeed=111ULL;
              Simulation sim(worldSeed,populationSeed,CurrentWorldGenerationVersion);
              sim.setupNewGame();
              World& world=sim.world();

              assert(world.characters.size()==4);
              assert(world.hasInitialStartRegionSelection);
              assert(world.generatedNaturalChunks.size()==1);
              assert(world.objects.empty());
              assert(world.storageSites.empty());
              assert(world.primitiveSanitationSites.empty());

              int males=0;
              int females=0;
              for(const Character& founder:world.characters){
                  if(founder.sex==Sex::Male) ++males;
                  if(founder.sex==Sex::Female) ++females;
                  GridPos pos{};
                  assert(sim.runtimePosition(founder.id,pos));
                  assert(chunkCoordForGrid(pos)==world.initialStartRegionCoord);
              }
              assert(males==2 && females==2);

              const GeneratedNaturalChunk* initialChunk=
                  world.findGeneratedNaturalChunk(world.initialStartRegionCoord);
              assert(initialChunk!=nullptr);
              assert(validGeneratedNaturalChunk(*initialChunk));
              const GeneratedNaturalChunk initialBaseline=*initialChunk;

              const WorldOverviewObservation overview=sim.observeWorldOverview();
              assert(overview.totalResidents==4);
              assert(overview.livingResidents==4);
              assert(sim.observeAllResidents().size()==4);

              // Exercise the real autonomous missing-toilet fallback and authoritative residue path.
              for(Character& resident:world.characters){
                  resident.needs={0.02,0.02,0.02,0.02,0.02};
              }
              world.characters.front().needs.bladder=0.98;
              sim.runMinutes(20);
              const EnvironmentObservation environment=sim.observeEnvironment();
              assert(environment.humanWasteResidues>=1);
              assert(environment.totalResidues>=1);

              // Save/load must preserve generated natural identity, resident positions,
              // environmental consequence and observer-readable state without reroll.
              std::string error;
              std::vector<std::uint8_t> bytes;
              assert(encodeSimulationSnapshot(sim.captureSnapshot(),bytes,&error));
              assert(error.empty());

              SimulationStateSnapshot decoded;
              assert(decodeSimulationSnapshot(bytes,decoded,&error));
              assert(error.empty());
              const GeneratedNaturalChunk* decodedChunk=
                  decoded.world.findGeneratedNaturalChunk(world.initialStartRegionCoord);
              assert(decodedChunk!=nullptr);
              assert(sameGeneratedNaturalChunkBaseline(initialBaseline,*decodedChunk));

              Simulation restored(1);
              assert(restored.restoreSnapshot(decoded,&error));
              assert(error.empty());
              assert(restored.observeWorldOverview().totalResidents==4);
              assert(restored.observeAllResidents().size()==4);
              assert(restored.observeEnvironment().humanWasteResidues==environment.humanWasteResidues);
              assert(restored.world().initialStartRegionCoord==world.initialStartRegionCoord);

              for(const Character& founder:restored.world().characters){
                  GridPos pos{};
                  assert(restored.runtimePosition(founder.id,pos));
                  assert(chunkCoordForGrid(pos)==restored.world().initialStartRegionCoord);
              }

              std::vector<std::uint8_t> restoredBytes;
              assert(encodeSimulationSnapshot(restored.captureSnapshot(),restoredBytes,&error));
              assert(bytes==restoredBytes);

              sim.runMinutes(120);
              restored.runMinutes(120);
              std::vector<std::uint8_t> futureA;
              std::vector<std::uint8_t> futureB;
              assert(encodeSimulationSnapshot(sim.captureSnapshot(),futureA,&error));
              assert(encodeSimulationSnapshot(restored.captureSnapshot(),futureB,&error));
              assert(futureA==futureB);

              std::cout << "GATE_A_CORE_RUNTIME_PASS\n";
              std::cout << "founders=4 male=2 female=2\n";
              std::cout << "start_chunk=" << world.initialStartRegionCoord.x << ',' << world.initialStartRegionCoord.y << '\n';
              std::cout << "generated_chunks=" << world.generatedNaturalChunks.size() << '\n';
              std::cout << "human_waste_residues=" << environment.humanWasteResidues << '\n';
              std::cout << "snapshot_bytes=" << bytes.size() << '\n';
              return 0;
          }
          CPP

          g++ -std=c++17 -UNDEBUG \
            -ISource/LifeLensCore/include \
            /tmp/gate_a_runtime.cpp \
            build/liblifelens_core.a \
            -o /tmp/gate_a_runtime

      - name: Run integrated Gate A runtime
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gate_a_runtime | tee /tmp/gate-a-runtime.log

      - name: Run supporting runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_production_new_game \
            test_world_generation_milestone_a \
            test_external_physical_execution \
            test_environmental_residue \
            test_environmental_exposure \
            test_core_save_load \
            test_civilization_observer_read_model
          do
            echo "=== $test ===" | tee -a /tmp/gate-a-runtime.log
            "./build/$test" 2>&1 | tee -a /tmp/gate-a-runtime.log
          done
          echo 'GATE_A_SUPPORTING_CONTRACTS_PASS' | tee -a /tmp/gate-a-runtime.log

      - name: Upload Gate A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gate-A-Core-Runtime-Evidence
          path: /tmp/gate-a-runtime.log
          if-no-files-found: warn
          retention-days: 7

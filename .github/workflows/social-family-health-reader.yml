name: LifeLens Social Family Health Artifact Reader

on:
  push:
    paths:
      - 'Tools/audit_social_family_health.py'
      - 'Tools/tests/test_social_family_health_audit.py'
      - '.github/workflows/social-family-health-reader.yml'
  pull_request:
    paths:
      - 'Tools/audit_social_family_health.py'
      - 'Tools/tests/test_social_family_health_audit.py'
      - '.github/workflows/social-family-health-reader.yml'

permissions:
  contents: read

jobs:
  family-health-artifact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: read-only 가족·건강 ZIP 판독 회귀테스트
        run: python3 -m unittest discover -s Tools/tests -p 'test_social_family_health_audit.py' -v

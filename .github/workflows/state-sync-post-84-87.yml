name: State Sync Post 84 87

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/state-sync-post-84-87.yml'
      - 'Tools/state_sync_post_84_87.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply canonical state/doc reorganization
        run: python Tools/state_sync_post_84_87.py

      - name: Commit docs and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLens State Sync'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/state-sync-post-84-87.yml Tools/state_sync_post_84_87.py
          git add AGENTS.md CLAUDE.md docs/STATE_MANAGEMENT.md docs/DEVELOPMENT_MILESTONES.md docs/PROJECT_PROGRESS_2026-09-15.md docs/WORLD_GENESIS_CHUNK_MIGRATION_v1.md tasks/WORK_STATE.md tasks/TEAM_BOARD.md tasks/DAGYEOM_READY_QUEUE.md tasks/HANDOFF_LOG.md
          git diff --cached --check
          git commit -m 'docs: close #84/#87 and adopt milestone governance'
          git push origin HEAD:main

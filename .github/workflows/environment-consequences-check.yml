name: Web Environmental Consequences
on:
  push:
    branches: ['work/web-environment-consequences-*']
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/environment-consequences-check.yml'
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: tar -czf /tmp/lifelens-web-dependencies.tgz node_modules
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: environmental-test-dependencies
          path: /tmp/lifelens-web-dependencies.tgz
          retention-days: 1
      - run: python Tools/prepare_web_character_assets.py
      - run: npm run typecheck
        working-directory: web
      - run: node tests/environment-consequences/run.mjs
        working-directory: web
      - run: node tests/presentation/run.mjs && node tests/human-traces/run.mjs && node tests/weather/run.mjs
        working-directory: web
      - run: node tests/sleep-era/run.mjs && node tests/resident-motion/run.mjs
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright && npx playwright install --with-deps chromium
        working-directory: web
      - run: node tests/environment-consequences/browser-review.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environmental-consequences-review
          path: web/tests/environment-consequences/review/

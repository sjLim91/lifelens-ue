name: LifeLens Web Runtime Resilience

on:
  # Automatic checks are consolidated in web-checks.yml / core-tests.yml.
  # Keep this focused manual replay available for diagnostics.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check web types
        working-directory: web
        run: npm run typecheck
      - name: Exercise loading and response failure paths
        run: node web/tests/runtime-resilience/run.mjs
      - name: Exercise resident cache continuity
        run: node web/tests/runtime-resilience/continuity.mjs
      - name: Exercise weather distribution and Core state transitions
        run: node web/tests/weather/run.mjs
      - name: Exercise character appearance and head attachment
        run: node web/tests/characters/run.mjs
      - name: Exercise touch gesture direction and transitions
        run: node web/tests/input/run.mjs
      - name: Exercise authoritative observation feed
        run: node web/tests/observation-feed/run.mjs
      - name: Exercise authoritative resident action context
        run: node web/tests/action-context/run.mjs
      - name: Exercise authoritative human traces and place focus
        run: node web/tests/human-traces/run.mjs
      - name: Exercise authoritative day fast-forward summary
        run: node web/tests/fast-forward/run.mjs
      - name: Exercise terrain camera and water presentation
        run: node web/tests/presentation/run.mjs
      - name: Build browser client
        working-directory: web
        run: npm run build


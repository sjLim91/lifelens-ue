name: LifeLens Web Runtime Resilience

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/src/runtime/**'
      - 'web/src/state/**'
      - 'web/src/ui/**'
      - 'web/src/input/**'
      - 'web/src/observer-engine.ts'
      - 'web/src/App.tsx'
      - 'web/src/styles.css'
      - 'web/tests/input/**'
      - 'web/src/render/weather-layer.ts'
      - 'web/src/render/resident-appearance.ts'
      - 'web/src/render/resident-world-layer.ts'
      - 'web/src/render/world-scene.ts'
      - 'web/src/render/terrain-geometry.ts'
      - 'web/src/render/water-*.ts'
      - 'web/tests/presentation/**'
      - 'web/tests/characters/**'
      - 'web/tests/weather/**'
      - 'web/tests/runtime-resilience/**'
      - 'web/tests/observation-feed/**'
      - 'web/package.json'
      - 'web/tsconfig.json'
      - '.github/workflows/web-runtime-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check web types
        working-directory: web
        run: npm run typecheck
      - name: Exercise loading and response failure paths
        run: node web/tests/runtime-resilience/run.mjs
      - name: Exercise resident cache continuity
        run: node web/tests/runtime-resilience/continuity.mjs
      - name: Exercise weather distribution and Core state transitions
        run: node web/tests/weather/run.mjs
      - name: Exercise character appearance and head attachment
        run: node web/tests/characters/run.mjs
      - name: Exercise touch gesture direction and transitions
        run: node web/tests/input/run.mjs
      - name: Exercise authoritative observation feed
        run: node web/tests/observation-feed/run.mjs
      - name: Exercise terrain camera and water presentation
        run: node web/tests/presentation/run.mjs
      - name: Build browser client
        working-directory: web
        run: npm run build

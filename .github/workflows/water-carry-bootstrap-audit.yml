name: LifeLens Water Carry Bootstrap 100d Audit

on:
  pull_request:
    paths:
      - 'Source/LifeLensCore/**'
      - '.github/workflows/water-carry-bootstrap-audit.yml'

permissions:
  contents: read

concurrency:
  group: lifelens-water-carry-bootstrap-100d-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  water-carry-bootstrap-audit:
    strategy:
      fail-fast: false
      matrix:
        seed: [874213954, 4242001]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: 기존 계측기 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release
      - name: 기존 계측기 빌드
        run: cmake --build build --target ll_water_carry_bootstrap_audit --parallel 2
      - name: 물 운반 부트스트랩 100일 계측
        run: |
          ./build/ll_water_carry_bootstrap_audit --seed '${{ matrix.seed }}' --days 100

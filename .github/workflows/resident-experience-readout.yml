name: LifeLens Resident Experience Readout

on:
  # Automatic checks are consolidated in web-checks.yml / core-tests.yml.
  # Keep this focused manual replay available for diagnostics.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firsthand-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web dependencies
        run: cd web && npm install --no-audit --no-fund
      - name: Test real personal experience summaries
        run: cd web && node tests/resident-experiences/run.mjs
      - name: Typecheck readout
        run: cd web && npm run typecheck


name: LifeLens Resident Experience Readout

on:
  push:
    paths:
      - 'web/src/ui/resident-experiences.ts'
      - 'web/src/ui/observer-readout.tsx'
      - 'web/tests/resident-experiences/run.mjs'
      - '.github/workflows/resident-experience-readout.yml'
  pull_request:
    paths:
      - 'web/src/ui/resident-experiences.ts'
      - 'web/src/ui/observer-readout.tsx'
      - 'web/tests/resident-experiences/run.mjs'
      - '.github/workflows/resident-experience-readout.yml'

permissions:
  contents: read

jobs:
  firsthand-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        run: cd web && npm ci
      - name: Test real personal experience summaries
        run: cd web && node tests/resident-experiences/run.mjs
      - name: Typecheck readout
        run: cd web && npm run typecheck

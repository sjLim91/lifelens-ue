name: LifeLens Selfcare 100d Audit

on:
  pull_request:
    paths:
      - 'Source/LifeLensCore/**'
      - '.github/workflows/balance-audit.yml'

permissions:
  contents: read

concurrency:
  group: lifelens-selfcare-100d-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  selfcare-audit:
    strategy:
      fail-fast: false
      matrix:
        seed: [874213954, 4242001]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 밸런스 계측기 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 밸런스 계측기 빌드
        run: cmake --build build --target ll_balance_audit --parallel 2

      - name: 100일 자기관리 계측
        run: |
          ./build/ll_balance_audit --seed '${{ matrix.seed }}' --days 100

name: LifeLens Balance Audit

on:
  push:
    branches:
      - experiment/p0-sanitation-progression-20261001
      - experiment/p0-sanitation-candidate-20261001
      - audit/sanitation-craft-trace-20261001
      - experiment/p0-sanitation-scheduler-20261001
      - audit/civilization-cadence-resonance-20261001
    paths:
      - 'Source/LifeLensCore/**'
      - '.github/workflows/balance-audit.yml'
  workflow_dispatch:
    inputs:
      days:
        description: '시뮬레이션 일수'
        required: false
        default: '100'
      seed:
        description: 'World seed'
        required: false
        default: '874213954'

permissions:
  contents: read

concurrency:
  group: lifelens-balance-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-audit:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [874213954, 4242001]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 밸런스 계측기 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 밸런스 계측기 빌드
        run: cmake --build build --target ll_balance_audit --parallel 2

      - name: 기준 전 구간 계측
        run: |
          for days in 100; do
            echo "===== seed=${{ matrix.seed }} days=$days ====="
            ./build/ll_balance_audit --seed '${{ matrix.seed }}' --days "$days"
          done

  manual-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 밸런스 계측기 구성
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: 밸런스 계측기 빌드
        run: cmake --build build --target ll_balance_audit --parallel 2

      - name: 수동 장기 계측
        run: |
          ./build/ll_balance_audit \
            --seed '${{ inputs.seed }}' \
            --days '${{ inputs.days }}'

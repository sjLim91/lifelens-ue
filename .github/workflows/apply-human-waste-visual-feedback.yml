name: Apply HumanWaste visual feedback patch

on:
  push:
    branches: [ jjun/human-waste-visual-feedback-v1 ]
    paths:
      - 'Tools/apply_human_waste_visual_feedback_patch.py'
      - '.github/workflows/apply-human-waste-visual-feedback.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: jjun/human-waste-visual-feedback-v1
          fetch-depth: 0

      - name: Apply patch
        run: python Tools/apply_human_waste_visual_feedback_patch.py

      - name: Validate structural contract locally
        run: python Tools/validate_environment_visual_feedback.py

      - name: Commit implementation and remove one-shot files
        run: |
          rm Tools/apply_human_waste_visual_feedback_patch.py
          rm .github/workflows/apply-human-waste-visual-feedback.yml
          git config user.name "LifeLens Visual Feedback Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add HumanWaste environmental visual feedback v1"
          git push origin HEAD:jjun/human-waste-visual-feedback-v1

name: LifeLens Preflight

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  structural-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate LifeLens bootstrap
        run: python Tools/validate_bootstrap.py

      - name: Validate SimulationRuleset contract
        run: python Tools/validate_simulation_ruleset.py

      - name: Validate civilization observer read contract
        run: python Tools/validate_civilization_observer.py

      - name: Validate observer projection needs
        run: python Tools/validate_observer_projection_needs.py

      - name: Validate primitive latrine progression
        run: python Tools/validate_primitive_latrine.py

      - name: Validate environmental visual feedback
        run: python Tools/validate_environment_visual_feedback.py

      - name: Validate whole-source audit invariants
        run: python Tools/validate_source_audit_invariants.py

      - name: Validate World Genesis WG-1
        run: python Tools/validate_world_genesis_wg1.py

      - name: Validate World Genesis WG-2
        run: python Tools/validate_world_genesis_wg2.py

      - name: Validate World Generation Milestone A
        run: python Tools/validate_world_generation_milestone_a.py

      - name: Validate graphics foundation invariants
        run: python Tools/validate_graphics_foundation.py

      - name: Validate platform content cook boundaries
        run: python Tools/validate_platform_cook_boundaries.py

      - name: Validate desktop PCG runtime dressing
        run: python Tools/validate_pcg_runtime_dressing.py

      - name: Validate desktop smooth terrain
        run: python Tools/validate_desktop_smooth_terrain.py

      - name: Validate photoreal facility completion
        run: python Tools/validate_photoreal_facility_completion.py

      - name: Validate environment density v1
        run: python Tools/validate_environment_density_v1.py

      - name: Verify Unreal project metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('LifeLens.uproject').read_text(encoding='utf-8'))
          assert p['EngineAssociation'] == '5.6'
          assert any(m['Name'] == 'LifeLens' and m['Type'] == 'Runtime' for m in p['Modules'])
          print('Unreal metadata preflight: PASS')
          PY

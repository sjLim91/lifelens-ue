name: LifeLens Preflight

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  structural-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate active Web/Core runtime architecture
        run: python Tools/validate_active_runtime_architecture.py

      - name: Validate SimulationRuleset contract
        run: python Tools/validate_simulation_ruleset.py

      - name: Validate civilization observer read contract
        run: python Tools/validate_civilization_observer.py

      - name: Validate emergent activity anchor
        run: python Tools/validate_emergent_activity_anchor.py

      - name: Validate facility footprint spacing
        run: python Tools/validate_facility_footprint_spacing.py

      - name: Validate household dependent-care fallback
        run: python Tools/validate_household_dependent_care.py

      - name: Validate World Genesis WG-1
        run: python Tools/validate_world_genesis_wg1.py

      - name: Validate World Genesis WG-2
        run: python Tools/validate_world_genesis_wg2.py

      - name: Validate World Generation Milestone A
        run: python Tools/validate_world_generation_milestone_a.py

      - name: Validate Web client foundation
        run: python Tools/validate_web_client_foundation.py

      - name: Validate Web 3D truth surface
        run: python Tools/validate_web_world_surface.py

      - name: Validate Web ecology projection
        run: python Tools/validate_web_ecology_projection.py

      - name: Validate Web presentation v2 environment
        run: python Tools/validate_web_presentation_v2_environment.py

      - name: Validate Web visible weather
        run: python Tools/validate_web_weather_visibility.py

      - name: Validate Web resident locomotion continuity
        run: python Tools/validate_web_resident_motion.py

      - name: Validate Web authoritative action context
        run: python Tools/validate_web_action_context.py

      - name: Validate Web authority DTO expansion
        run: python Tools/validate_web_authority_dto.py

      - name: Validate Web world activity observation
        run: python Tools/validate_web_world_activity_observation.py

      - name: Validate Web Observer Director
        run: python Tools/validate_web_observer_director.py

      - name: Validate Web resident truth details
        run: python Tools/validate_web_resident_truth_details.py

      - name: Validate Web Korean-only UI contract
        run: python Tools/validate_web_korean_ui.py

      - name: Validate Web visible facility structures
        run: python Tools/validate_web_facility_structures.py

      - name: Validate Web authoritative day fast-forward
        run: python Tools/validate_web_fast_forward.py

      - name: Validate Web animated water surface
        run: python Tools/validate_web_water_surface.py

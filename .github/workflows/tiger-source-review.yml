name: LifeLens Tiger Source Evidence

on:
  push:
    branches: ['feat/tiger-source-web-integration-*']
    paths:
      - 'Tools/assets/**'
      - 'Tools/blender/review_imported_tiger.py'
      - '.github/workflows/tiger-source-review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiger-source-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public license and anonymous download responses
        run: python3 Tools/assets/probe_tiger_sources.py --output review/tiger-source-evidence.json
      - name: Acquire openly published CC0 static candidate for review only
        run: python3 Tools/assets/review_public_tiger.py docs/asset-reviews/tiger-30235
      - name: Install free Blender on ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
      - name: Inspect original geometry and render four views
        run: blender --background --factory-startup --disable-autoexec --python-exit-code 1 --threads 2 --python Tools/blender/review_imported_tiger.py -- docs/asset-reviews/tiger-30235
      - name: Preserve review files on the Draft branch only
        env:
          REVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          case "$REVIEW_BRANCH" in feat/tiger-source-web-integration-*) ;; *) exit 1 ;; esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/asset-reviews/tiger-30235
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve CC0 tiger candidate source and four-view review; not runtime approved [skip ci]'
            git push origin "HEAD:$REVIEW_BRANCH"
          fi
      - name: Preserve inspection evidence (not quality acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiger-source-evidence
          path: |
            review/tiger-source-evidence.json
            docs/asset-reviews/tiger-30235/
          if-no-files-found: error
          retention-days: 14

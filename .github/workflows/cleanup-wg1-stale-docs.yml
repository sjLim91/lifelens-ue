name: Cleanup WG-1 stale docs

on:
  push:
    branches: [ main ]
    paths:
      - 'Tools/cleanup_wg1_stale_docs.py'
      - '.github/workflows/cleanup-wg1-stale-docs.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message != 'docs: remove stale WG-1 state markers' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cleanup stale state markers
        run: python Tools/cleanup_wg1_stale_docs.py

      - name: Commit corrected docs and remove temporary helper
        run: |
          git config user.name "LifeLens State Sync"
          git config user.email "actions@users.noreply.github.com"
          git add tasks/WORK_STATE.md
          git add tasks/TEAM_BOARD.md
          git add docs/PROJECT_PROGRESS_2026-09-15.md
          git rm Tools/cleanup_wg1_stale_docs.py
          git rm .github/workflows/cleanup-wg1-stale-docs.yml
          git commit -m "docs: remove stale WG-1 state markers"
          git push origin HEAD:main

name: LifeLens PR17 handoff append

on:
  push:
    branches:
      - docs/pr17-handoff-append

permissions:
  contents: write

jobs:
  append_handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pr17-handoff-append
          fetch-depth: 0
      - name: Append handoff checkpoint
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d >> tasks/HANDOFF_LOG.md
          git rm .github/workflows/tmp-pr17-handoff-append.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tasks/HANDOFF_LOG.md
          git commit -m 'docs: append Observer HUD integration handoff'
          git push origin HEAD:docs/pr17-handoff-append

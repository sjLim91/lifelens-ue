name: LifeLens Earth Region Scenario Contract

on:
  push:
    paths:
      - 'Source/LifeLensCore/include/lifelens/EarthRegionScenario.h'
      - 'Source/LifeLensCore/include/lifelens/EarthSurfaceCoordinates.h'
      - 'Source/LifeLensCore/tests/test_earth_region_scenario.cpp'
      - '.github/workflows/earth-region-scenario-contract.yml'
  pull_request:
    paths:
      - 'Source/LifeLensCore/include/lifelens/EarthRegionScenario.h'
      - 'Source/LifeLensCore/include/lifelens/EarthSurfaceCoordinates.h'
      - 'Source/LifeLensCore/tests/test_earth_region_scenario.cpp'
      - '.github/workflows/earth-region-scenario-contract.yml'

permissions:
  contents: read

jobs:
  core-earth-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test the explicit Core geo-scenario catalog
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG \
            -I Source/LifeLensCore/include \
            Source/LifeLensCore/tests/test_earth_region_scenario.cpp \
            -o /tmp/lifelens_earth_region_scenario
          /tmp/lifelens_earth_region_scenario

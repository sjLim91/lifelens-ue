name: LifeLens Core Tests

on:
  push:
    paths:
      - 'Source/LifeLensCore/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - 'Source/LifeLensCore/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reuse successful same-SHA push validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          reuse = False
          if os.environ["EVENT_NAME"] == "pull_request":
              repo = os.environ["GH_REPOSITORY"]
              sha = os.environ["SOURCE_SHA"]
              query = urllib.parse.urlencode({
                  "event": "push",
                  "status": "success",
                  "head_sha": sha,
                  "per_page": 10,
              })
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/core-tests.yml/runs?{query}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "lifelens-core-ci-reuse",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              reuse = any(
                  run.get("head_sha") == sha
                  and run.get("event") == "push"
                  and run.get("conclusion") == "success"
                  for run in payload.get("workflow_runs", [])
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"reuse={'true' if reuse else 'false'}\n")

          if reuse:
              print(
                  "Same head SHA already passed the push Core Tests run; "
                  "skipping duplicate PR build/test/harness."
              )
          else:
              print("No reusable successful push validation; running full Core gate.")
          PY

      - name: Checkout
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@v4

      - name: Configure
        if: steps.reuse.outputs.reuse != 'true'
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.reuse.outputs.reuse != 'true'
        run: cmake --build build -j2

      - name: Test
        if: steps.reuse.outputs.reuse != 'true'
        run: ctest --test-dir build --output-on-failure

      - name: Deterministic harness smoke
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          ./build/ll_harness --days 1 --seed 42 > /tmp/run-a.log
          ./build/ll_harness --days 1 --seed 42 > /tmp/run-b.log
          diff -u /tmp/run-a.log /tmp/run-b.log
          tail -20 /tmp/run-a.log

      - name: Reused validation summary
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "Reused successful same-SHA push Core Tests validation."

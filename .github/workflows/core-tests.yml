name: LifeLens Core Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'Source/LifeLensCore/**'
      - 'Tools/ci_scope.py'
      - 'Tools/verify_sleep_longrun.py'
      - 'Tools/test_verify_sleep_longrun.py'
      - 'tasks/WEATHER_SLEEP_ERA_LONGRUN.json'
      - '.github/workflows/core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Source/LifeLensCore/**'
      - 'Tools/ci_scope.py'
      - 'Tools/verify_sleep_longrun.py'
      - 'Tools/test_verify_sleep_longrun.py'
      - 'tasks/WEATHER_SLEEP_ERA_LONGRUN.json'
      - '.github/workflows/core-tests.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifelens-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Core and long-run scope
        id: scope
        run: python3 Tools/ci_scope.py
      - name: Configure Core once
        run: cmake -S Source/LifeLensCore -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Core once
        run: cmake --build build -j2
      - name: Core regression suite
        run: ctest --test-dir build --output-on-failure
      # Native proof from two unmodified New Game worlds, no injected intent.
      - name: AL-1 native production resident witness
        run: ctest --test-dir build --verbose -R 'test_al1_production_closed_loop'

      - name: AL-1 genuine Core failure paired causal contrast
        run: ctest --test-dir build --verbose -R 'test_al1_causal_counterfactual'
      - name: Deterministic harness
        run: |
          ./build/ll_harness --days 1 --seed 42 > /tmp/harness-first.txt
          ./build/ll_harness --days 1 --seed 42 > /tmp/harness-second.txt
          cmp /tmp/harness-first.txt /tmp/harness-second.txt
      - name: Long-run verifier regression
        if: steps.scope.outputs.long_run == 'true'
        run: python3 Tools/test_verify_sleep_longrun.py
      - name: Relevant Core changes or nightly 365-day verification
        if: steps.scope.outputs.long_run == 'true'
        run: |
          for seed in 874213954 874213955 2; do
            ./build/ll_balance_audit --days 365 --seed "$seed" --checkpoints 100,365 --sleep-diagnostics > "candidate-$seed.log"
          done
          python3 Tools/verify_sleep_longrun.py candidate-*.log > sleep-longrun-metrics.json
      - name: Upload long-run diagnostics
        if: always() && steps.scope.outputs.long_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weather-sleep-longrun
          path: |
            candidate-*.log
            sleep-longrun-metrics.json
          if-no-files-found: ignore

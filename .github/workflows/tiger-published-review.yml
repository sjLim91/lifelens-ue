name: Tiger Published Observer Probe
on:
  push:
    branches: ['feat/tiger-source-web-integration-*']
    paths:
      - 'web/tests/tiger-observer/published.mjs'
      - '.github/workflows/tiger-published-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tiger-public-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identify the existing published review build
        run: |
          # A source rebuild may be publishing concurrently. A normal preview
          # can replace the old review; wait for the review publication first.
          for attempt in $(seq 1 60); do
            git fetch --depth=1 origin gh-pages
            git log -1 --format=%B FETCH_HEAD > /tmp/tiger-pages-message.txt
            if grep -q '^Draft tiger review:' /tmp/tiger-pages-message.txt; then break; fi
            test "$attempt" -lt 60
            sleep 5
          done
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          message=Path('/tmp/tiger-pages-message.txt').read_text()
          assert message.startswith('Draft tiger review:'), message
          sha=re.search(r'[0-9a-f]{40}',message).group(0)
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('LIFELENS_REVIEW_EXPECTED_BUILD='+sha+'\n')
          PY
      - name: Install free browser verification dependencies
        run: |
          python3 Tools/prepare_web_character_assets.py
          npm install --prefix web --ignore-scripts --no-audit --no-fund
          npm install --prefix web --no-save --ignore-scripts --no-audit --no-fund playwright
          cd web
          npx playwright install --with-deps chromium
      - name: Verify actual public app WASM and model bytes
        working-directory: web
        run: node tests/tiger-observer/published.mjs
      - name: Retain actual outcome including failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The full Observer job also writes the canonical report. Keep this
          # independent probe append-only so simultaneous successful captures
          # cannot conflict while rebasing their measured samples or images.
          evidence="web/tests/tiger-observer/review/public-probes/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          cp web/tests/tiger-observer/review/published-validation.json "$evidence/"
          if [ -f web/tests/tiger-observer/review/published-observer.jpg ]; then cp web/tests/tiger-observer/review/published-observer.jpg "$evidence/"; fi
          git add -f "$evidence"
          git restore --worktree -- web/tests/tiger-observer/review
          if ! git diff --cached --quiet; then
            git commit -m 'Record public Observer verification outcome without quality acceptance [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              test "$attempt" -lt 3
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiger-public-probe
          path: web/tests/tiger-observer/review/published-*
          retention-days: 7


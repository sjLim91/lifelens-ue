name: Procedural Environment
on:
  # Automatic checks are consolidated in web-checks.yml / core-tests.yml.
  # Keep this focused manual replay available for diagnostics.
  workflow_dispatch:

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: python3 Tools/prepare_web_character_assets.py
      - run: npm run typecheck
        working-directory: web
      - run: python3 Tools/validate_web_presentation_v2_environment.py
      - run: node tests/procedural-environment/run.mjs && node tests/procedural-environment/lifecycle.mjs && node tests/procedural-environment/grounding-wildlife.mjs && node tests/facility-construction/run.mjs && node tests/presentation/run.mjs
        working-directory: web
      - run: node tests/environment-consequences/run.mjs && node tests/procedural-motion/run.mjs && node tests/resident-motion/run.mjs
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright && npx playwright install --with-deps chromium
        working-directory: web
      - run: cmake -S Source/LifeLensCore -B /tmp/ecology-core -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/ecology-core --target ll_ecology_fixture test_natural_ecology_lifecycle -j2
      - run: /tmp/ecology-core/test_natural_ecology_lifecycle && mkdir -p web/tests/procedural-environment/review && /tmp/ecology-core/ll_ecology_fixture web/tests/procedural-environment/review/core-fixture.json
      - run: node tests/procedural-environment/browser-review.mjs
        working-directory: web
      - run: node tests/procedural-environment/wildlife-browser-review.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procedural-environment-review
          path: web/tests/procedural-environment/review/



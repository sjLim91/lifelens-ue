name: Close PR67 state sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/close-pr67-state-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical state sync
        run: python Tools/close_pr67_state_sync.py

      - name: Commit state sync and remove one-shot files
        run: |
          git config user.name "LifeLens State Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Character Appearance v1 and promote Motion Bootstrap"
          git push origin HEAD:main

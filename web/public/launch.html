<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08100b" />
    <title>LifeLens Preview</title>
    <style>
      :root { color-scheme: dark; background: #08100b; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #08100b; color: #edf4ed; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(92vw, 520px);
        display: grid;
        gap: 12px;
        text-align: center;
      }
      h1 { margin: 0; font-size: clamp(28px, 8vw, 44px); }
      p { margin: 0; color: #9fb4a4; line-height: 1.5; }
      a {
        display: inline-flex;
        justify-content: center;
        margin-top: 8px;
        padding: 12px 16px;
        border: 1px solid #34503d;
        border-radius: 12px;
        color: #edf4ed;
        text-decoration: none;
        background: #102016;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LifeLens</h1>
      <p id="status">최신 웹 월드를 여는 중…</p>
      <a id="manual" href="./index.html">바로 열기</a>
    </main>
    <script>
      (() => {
        const status = document.getElementById('status');
        const manual = document.getElementById('manual');
        const current = new URL(window.location.href);
        const target = new URL('./index.html', current.href);
        const version = current.searchParams.get('v') || Date.now().toString();
        target.searchParams.set('v', version);
        manual.href = target.href;

        const redirect = () => window.location.replace(target.href);
        const controller = new AbortController();
        const timeout = window.setTimeout(() => {
          controller.abort();
          redirect();
        }, 3500);

        fetch(current.pathname + current.search, {
          method: 'POST',
          credentials: 'include',
          redirect: 'follow',
          cache: 'no-store',
          signal: controller.signal,
        }).catch(() => undefined).finally(() => {
          window.clearTimeout(timeout);
          redirect();
        });

        window.setTimeout(() => {
          if (status) status.textContent = '연결이 지연되고 있습니다. 아래 버튼으로 바로 열 수 있습니다.';
        }, 2200);
      })();
    </script>
  </body>
</html>

<!doctype html><html lang="ko"><meta charset="utf-8"><title>주민 원본 연결 검증</title><style>body{margin:0}canvas{display:block}</style><script type="module">
import * as THREE from 'three';
import {ResidentWorldLayer} from '/src/render/resident-world-layer.ts';
import {WORLD_GRID_CONTRACT as G} from '/src/runtime/lifelens-contract.ts';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1000,760);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x737c70);scene.add(new THREE.HemisphereLight(0xfff4e8,0x4c5546,2.5));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(3,5,6);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x79826f}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);
const camera=new THREE.PerspectiveCamera(34,1000/760,.01,100);camera.position.set(0,1.5,6.5);camera.lookAt(0,.85,0);
const layer=new ResidentWorldLayer();scene.add(layer.group);
for(let i=0;i<1200&&!layer.ready;i++)await new Promise(r=>setTimeout(r,20));if(!layer.ready)throw Error('resident layer not ready');
const terrain={available:true,worldSeed:'native-resident-contract',centerChunkX:0,centerChunkY:0,chunks:[{x:0,y:0,elevation01:0,waterKind:'None'}]};
const facts=[{id:'female',sex:'Female',ageYears:30},{id:'male',sex:'Male',ageYears:30}].map((r,i)=>({...r,alive:true,lifeStage:'Adult',hasPosition:true,gridX:(.5+(i? .65:-.65)/G.worldUnitsPerChunk)*G.gridCellsPerChunk,gridY:G.gridCellsPerChunk*.5,genetics:{heightPotential:.5,buildPotential:.5,faceShape:.5,skinTone:.5,hairPigment:.5,eyePigment:.5}}));
const original=JSON.stringify(facts);layer.setResidents(facts,terrain,0,0);for(let i=0;i<30;i++)layer.update(.016);
function sample(){return [...layer.actors].map(([id,a])=>{const group=a.model.getObjectByName('LifeLensNativeResident');const body=a.model.getObjectByName('LifeLensAuthoredAnatomicalBody');const p=body.geometry.getAttribute('position');body.skeleton.update();body.updateMatrixWorld(true);const point=new THREE.Vector3(),bounds=new THREE.Box3();for(let i=0;i<p.count;i++)bounds.expandByPoint(body.getVertexPosition(i,point).applyMatrix4(body.matrixWorld));return{id,native:!!group,source:body.userData.nativeResidentSource,version:body.geometry.userData.anatomyVersion,meshCount:group?.children.map(level=>level.children.length),tiers:group?.children.map(level=>({name:level.name,visible:level.visible,triangles:level.children.reduce((n,m)=>n+(m.geometry.index?.count??m.geometry.getAttribute('position').count)/3,0)})),sameSkeleton:body.skeleton===a.model.getObjectByName('SuperHero_Male').skeleton,uv:!!body.geometry.getAttribute('uv'),texture:!!body.material.map,active:a.active,position:a.root.position.toArray(),bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()}};});}
function render(){renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');}
function phenotypeRefreshInvariant(){
 const actor=layer.actors.get('female'),position=actor.root.position.clone(),before=JSON.stringify(facts);
 const update=(faceShape)=>{const r={...facts[0],genetics:{...facts[0].genetics,faceShape}};layer.ensureActor(r);return Array.from(actor.model.getObjectByName('LifeLensAuthoredAnatomicalBody').geometry.getAttribute('position').array);};
 update(.2);const near=update(.8);actor.root.position.set(10000,40,-10000);actor.root.updateMatrixWorld(true);
 update(.2);const far=update(.8);actor.root.position.copy(position);actor.root.updateMatrixWorld(true);layer.ensureActor(facts[0]);
 return {maximumRestDifference:near.reduce((n,v,i)=>Math.max(n,Math.abs(v-far[i])),0),coreFactsUnchanged:before===JSON.stringify(facts)};
}
window.nativeQA={layer,facts,sample,render,phenotypeRefreshInvariant,view(name){camera.position.set(name==='side'?5:0,1.5,name==='side'?0:6.5);camera.lookAt(0,.85,0);return render();},lod(distance){camera.position.set(0,1.5,distance);camera.lookAt(0,.85,0);layer.update(.016,camera);return sample();},stage(sex,ageYears,lifeStage,pregnancy){const r={...facts[0],sex,ageYears,lifeStage,pregnancy};layer.setResidents([r],terrain,0,0);for(let i=0;i<50;i++)layer.update(.016);return sample();},motion(kind){for(const r of facts){r.presentation={active:true,kind:'Physical',physicalGoal:kind,phase:'Interacting',hasTargetGrid:true,targetGridX:r.gridX,targetGridY:r.gridY};}layer.setResidents(facts,terrain,0,0);for(let i=0;i<150;i++)layer.update(.016);return sample();},original};
render();window.nativeReady=true;
</script></html>
